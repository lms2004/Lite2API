<div class="app-shell native-shell">
<aside class="sidebar" aria-label="Lite2API 主导航">
  <div class="brand" title="Lite2API">
    <div class="brand-mark"><svg class="icon" aria-hidden="true"><use href="#i-logo"></use></svg></div>
    <div class="brand-copy"><strong>Lite2API</strong><small>个人模型网关</small></div>
  </div>
  <nav class="nav" aria-label="核心导航">
    <button class="active" data-view="monitor" onclick="showView('monitor')"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-monitor"></use></svg></span><span>运行总览</span></button>
    <button data-view="accounts" onclick="showView('accounts')"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-accounts"></use></svg></span><span>账号管理</span></button>
    <button data-view="keys" onclick="showView('keys')"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-key"></use></svg></span><span>API 密钥</span></button>
    <button data-view="adapters" onclick="showView('adapters')"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-adapters"></use></svg></span><span>适配器</span></button>
    <button data-view="routes" onclick="showView('routes')"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-routes"></use></svg></span><span>模型路由</span></button>
    <button data-view="prompt-test" onclick="showView('prompt-test')"><span class="nav-icon"><svg class="icon" aria-hidden="true"><use href="#i-sparkles"></use></svg></span><span>注入检测</span></button>
  </nav>
  <div class="sidebar-foot"><span>本机管理控制台</span><small id="uiBuild">UI build 2026.08.20-v12</small></div>
</aside>
<main class="main">
  <header class="topbar">
    <div class="topbar-title sr-only"><strong id="viewTitle">运行总览</strong><span id="viewSubtitle">额度、调用量、速度与渠道质量</span></div>
    <div class="topbar-tools">
      <div class="theme-control">
        <label class="theme-control-label" for="themeMode">主题</label>
        <select id="themeMode" aria-label="页面主题" onchange="setThemeMode(this.value)">
          <option value="system">跟随系统</option>
          <option value="light">白天模式</option>
          <option value="dark">夜间模式</option>
        </select>
      </div>
      <div class="vpn-auth" aria-label="管理会话状态"><span class="vpn-dot"></span><span>已连接</span><span id="lastUpdated" class="muted">等待同步</span></div>
    </div>
  </header>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
