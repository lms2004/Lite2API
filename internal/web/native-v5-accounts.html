<section id="view-accounts" class="view native-view v10-page v10-accounts">
  <header class="v10-page-head">
    <div>
      <span class="v10-eyebrow">Accounts & channels</span>
      <h1>账号管理</h1>
      <p>先看每个账号还剩多少额度，再管理 OAuth、API Key、Web 凭据和路由连接。</p>
    </div>
    <div class="actions account-actions">
      <button class="btn-ghost" type="button" onclick="openImport()"><svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg>批量导入</button>
      <details class="more-menu"><summary aria-label="更多账号操作"><svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg></summary><div class="more-popover"><button id="openExportBtn" onclick="openExport();this.closest('details').removeAttribute('open')">导出账号与连接</button></div></details>
      <button class="primary" type="button" onclick="openQuickAdd()"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>添加账号</button>
    </div>
  </header>

  <section class="v10-account-summary" aria-label="账号额度概况">
    <div id="metrics" class="metric-grid upstream-metrics"></div>
  </section>

  <section class="v10-account-workspace">
    <aside class="v10-account-nav">
      <div class="v10-nav-heading"><span class="v10-eyebrow">Inventory</span><strong>查看内容</strong></div>
      <div class="source-segment" role="tablist" aria-label="账号与连接视图">
        <button type="button" class="active" data-source-tab="accounts" role="tab" aria-selected="true"><span>认证账号</span><small>额度、套餐、冷却与凭据状态</small></button>
        <button type="button" data-source-tab="connections" role="tab" aria-selected="false"><span>API 连接</span><small>Base URL、协议、模型与并发</small></button>
      </div>
      <div class="v10-account-tip"><strong>账号 ≠ 连接</strong><span>账号是真实订阅或凭据；连接是路由使用的稳定入口。一个连接可以承载多个账号。</span></div>
      <button class="v10-import-shortcut" type="button" onclick="openImport()"><svg class="icon" aria-hidden="true"><use href="#i-upload"></use></svg><span><strong>从文件导入</strong><small>支持 Lite2API 与 Sub2API v1 JSON</small></span></button>
    </aside>

    <div class="v10-account-content">
      <section id="v5SourceAccounts" class="source-pane" role="tabpanel">
        <div class="v10-pane-head">
          <div><span class="v10-eyebrow">Credential accounts</span><h2>认证账号与额度</h2><p>优先显示额度预警、冷却和不可用账号。</p></div>
          <div class="toolbar"><div class="search"><input id="oauthAccountSearch" aria-label="搜索认证账号" placeholder="搜索账号、套餐或渠道"></div><select id="oauthAccountStatus" aria-label="账号状态筛选"><option value="">全部状态</option><option value="ready">可用</option><option value="attention">需关注</option><option value="quota">额度预警</option></select></div>
        </div>
        <div id="oauthChannelRail" class="channel-rail" role="tablist" aria-label="按渠道筛选账号"></div>
        <div id="oauthAccounts" class="channel-groups"><div class="empty">正在读取认证账号…</div></div>
        <div class="pagination-note"><span id="oauthAccountCount"></span></div>
      </section>

      <section id="v5SourceConnections" class="source-pane" role="tabpanel" hidden>
        <div class="v10-pane-head">
          <div><span class="v10-eyebrow">API connections</span><h2>路由连接</h2><p id="accountHealthNote">路由实际请求的地址、协议、模型和并发入口。</p></div>
          <div class="toolbar"><div class="search"><input id="accountSearch" aria-label="搜索 API 连接" placeholder="搜索名称、ID 或地址"></div><select id="accountType" aria-label="协议筛选"><option value="">全部协议</option><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select><select id="accountStatus" aria-label="状态筛选"><option value="">全部状态</option><option value="enabled">已启用</option><option value="disabled">已禁用</option></select></div>
        </div>
        <div class="table-wrap"><table class="data-table account-table"><thead><tr><th class="check-col"><input id="selectAllAccounts" type="checkbox" aria-label="选择全部当前连接" onchange="toggleAllAccounts(this.checked)"></th><th>连接</th><th>提供方 / 地址</th><th>状态</th><th>模型</th><th>并发</th><th>请求 / 失败</th><th>平均速度</th><th aria-label="操作"></th></tr></thead><tbody id="accounts"><tr><td colspan="9" class="empty">正在读取连接…</td></tr></tbody></table></div>
        <div id="accountCount" class="pagination-note">0 个连接</div>
      </section>
    </div>
  </section>
</section>
