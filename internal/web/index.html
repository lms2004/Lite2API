<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lite2API</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#26334e;--text:#edf2ff;--muted:#91a0bd;--accent:#6ee7b7;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17213a,var(--bg) 42%);color:var(--text);font:14px/1.5 system-ui,sans-serif}.wrap{max-width:1120px;margin:auto;padding:28px 18px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}h1{margin:0;font-size:26px}h2{font-size:16px;margin:0 0 14px}.muted{color:var(--muted)}.panel{background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 14px 40px #0004}.auth{display:flex;gap:8px}input,select,button,textarea{border:1px solid var(--line);border-radius:8px;background:#0c1427;color:var(--text);padding:9px 10px}input,select{min-width:120px}button{cursor:pointer;background:#1d2a44}button.primary{background:#087f5b;border-color:#10b981}button.danger{color:#fecdd3}button:hover{filter:brightness(1.15)}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.metric{background:#0c1427;border-radius:10px;padding:12px}.metric strong{display:block;font-size:22px}.accounts{display:grid;gap:10px}.account{display:grid;grid-template-columns:1.5fr 2fr repeat(4,1fr) auto;gap:10px;align-items:center;background:#0c1427;border-radius:10px;padding:12px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:7px}.dot.off{background:var(--bad)}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:9px 7px}th{color:var(--muted)}.form{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.form .wide{grid-column:span 2}.notice{min-height:22px;color:var(--accent)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.account,.form{grid-template-columns:1fr 1fr}.account>*:nth-child(n+5){display:none}header{align-items:flex-start;flex-direction:column}.auth{width:100%}.auth input{flex:1}}
  </style>
</head>
<body><div class="wrap">
  <header><div><h1>Lite2API</h1><div class="muted">个人模型账号池与高并发 API 网关</div></div><div class="auth"><input id="token" type="password" placeholder="管理员 Token"><button class="primary" onclick="login()">连接</button></div></header>
  <div id="notice" class="notice"></div>
  <section class="panel"><h2>运行状态</h2><div id="metrics" class="grid"></div></section>
  <section class="panel"><h2>账号池</h2><div id="accounts" class="accounts muted">输入管理员 Token 后加载</div></section>
  <section class="panel"><h2>添加或更新账号</h2><form id="accountForm" class="form">
    <select name="preset" onchange="applyPreset(this.value)"><option value="">渠道预设（可选）</option><option value="atom">AtomCode</option><option value="gemini">Gemini Web</option><option value="grok">Grok2API</option><option value="deepseek">DeepSeek 官方</option><option value="openai">OpenAI 兼容</option></select>
    <input name="id" placeholder="唯一 ID" required><input name="name" placeholder="显示名称"><select name="type"><option value="openai">OpenAI 兼容</option><option value="anthropic">Anthropic</option></select><input name="base_url" placeholder="Base URL" required class="wide">
    <input name="api_key" type="password" placeholder="API Key（更新时可留空）" class="wide"><input name="api_key_env" placeholder="密钥环境变量（推荐）" class="wide"><input name="models" placeholder="模型，逗号分隔" class="wide"><input name="model_map" placeholder='模型映射 JSON，如 {"alias":"real"}' class="wide"><input name="concurrency" type="number" value="1" min="0" placeholder="并发"><input name="priority" type="number" value="0" min="0" placeholder="优先级"><input name="weight" type="number" value="1" min="1" placeholder="权重"><select name="enabled"><option value="true">启用</option><option value="false">禁用</option></select><button class="primary" type="submit">保存账号</button>
  </form></section>
  <section class="panel"><h2>模型路由</h2><p class="muted">客户端使用左侧别名；accounts 决定候选账号，upstream_model 决定实际上游模型。</p><textarea id="routes" rows="10" style="width:100%;font-family:ui-monospace,monospace" oninput="routesDirty=true"></textarea><div style="margin-top:9px"><button class="primary" onclick="saveRoutes()">保存并热加载</button></div></section>
  <section class="panel"><h2>最近请求</h2><div style="overflow:auto"><table><thead><tr><th>时间</th><th>模型</th><th>账号</th><th>状态</th><th>耗时</th><th>错误</th></tr></thead><tbody id="requests"></tbody></table></div></section>
</div><script>
const $=id=>document.getElementById(id); let timer,routesDirty=false;
function auth(){return {'Authorization':'Bearer '+localStorage.getItem('lite2api_admin'),'Content-Type':'application/json'}}
function say(x,bad=false){$('notice').textContent=x;$('notice').style.color=bad?'var(--bad)':'var(--accent)'}
async function api(path,opt={}){const r=await fetch('/admin/api'+path,{...opt,headers:{...auth(),...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error?.message||r.statusText);return d}
function login(){localStorage.setItem('lite2api_admin',$('token').value);load()}
async function load(){try{const d=await api('/state');render(d);say('已连接');clearTimeout(timer);timer=setTimeout(load,5000)}catch(e){say(e.message,true)}}
function render(d){const s=d.stats;$('metrics').innerHTML=[['请求',s.requests],['成功',s.successful],['失败',s.failed],['换号',s.failovers],['处理中',s.active]].map(x=>`<div class="metric"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></div>`).join('');$('accounts').innerHTML=d.accounts.map(a=>`<div class="account"><div><span class="dot ${a.enabled?'':'off'}"></span><strong>${esc(a.name||a.id)}</strong><div class="muted">${esc(a.id)}</div></div><div>${esc(a.base_url)}</div><div>并发 ${a.active}/${a.concurrency||'∞'}</div><div>请求 ${a.total_requests}</div><div>失败 ${a.consecutive_failures}</div><div>${a.average_latency_ms} ms</div><button class="danger" onclick="del('${encodeURIComponent(a.id)}')">删除</button></div>`).join('')||'<span class="muted">暂无账号</span>';if(!routesDirty)$('routes').value=JSON.stringify(d.config.routes||{},null,2);$('requests').innerHTML=s.recent.map(r=>`<tr><td>${new Date(r.time).toLocaleTimeString()}</td><td>${esc(r.model)}</td><td>${esc(r.account_id)}</td><td>${r.status}</td><td>${r.latency_ms} ms</td><td>${esc(r.error||'')}</td></tr>`).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const presets={atom:{id:'atom-main',name:'AtomCode',base_url:'http://127.0.0.1:45678/v1',api_key_env:'ATOMCODE2API_KEY',models:'deepseek-v4-flash,Qwen/Qwen3-VL-8B-Instruct',model_map:'{"deepseek-fast":"deepseek-v4-flash"}',concurrency:1},gemini:{id:'gemini-local',name:'Gemini Web',base_url:'http://127.0.0.1:45681/v1',api_key_env:'GEMINI_WEB2API_KEY',models:'gemini-3.6-flash,gemini-3.5-flash-thinking,gemini-3.1-pro,gemini-auto,gemini-flash-lite',model_map:'{"gemini":"gemini-3.6-flash"}',concurrency:2},grok:{id:'grok-local',name:'Grok2API',base_url:'http://127.0.0.1:45680/v1',api_key_env:'GROK2API_KEY',models:'grok-4.5,grok-4.3,grok-chat-fast,grok-chat-auto,grok-chat-expert',model_map:'{}',concurrency:4},deepseek:{id:'deepseek-main',name:'DeepSeek API',base_url:'https://api.deepseek.com/v1',api_key_env:'DEEPSEEK_API_KEY',models:'deepseek-chat,deepseek-reasoner',model_map:'{"deepseek":"deepseek-chat"}',concurrency:4},openai:{id:'openai-main',name:'OpenAI Compatible',base_url:'https://api.openai.com/v1',api_key_env:'OPENAI_API_KEY',models:'*',model_map:'{}',concurrency:4}};
function applyPreset(name){const p=presets[name];if(!p)return;const f=$('accountForm');for(const [k,v] of Object.entries(p)){const e=f.elements.namedItem(k);if(e)e.value=v}}
async function del(id){if(!confirm('确认删除这个账号？'))return;try{await api('/accounts/'+id,{method:'DELETE'});await load()}catch(e){say(e.message,true)}}
async function saveRoutes(){try{const routes=JSON.parse($('routes').value);await api('/routes',{method:'PUT',body:JSON.stringify(routes)});routesDirty=false;say('模型路由已保存并加载');await load()}catch(e){say(e.message,true)}}
$('accountForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);let modelMap={};try{modelMap=JSON.parse(f.get('model_map')||'{}')}catch(_){say('模型映射必须是 JSON 对象',true);return}const a={id:f.get('id').trim(),name:f.get('name').trim(),type:f.get('type'),base_url:f.get('base_url').trim(),api_key:f.get('api_key'),api_key_env:f.get('api_key_env').trim(),models:f.get('models').split(',').map(x=>x.trim()).filter(Boolean),model_map:modelMap,concurrency:+f.get('concurrency'),priority:+f.get('priority'),weight:+f.get('weight'),enabled:f.get('enabled')==='true'};try{await api('/accounts',{method:'PUT',body:JSON.stringify(a)});e.target.reset();say('账号已保存');await load()}catch(err){say(err.message,true)}};
$('token').value=localStorage.getItem('lite2api_admin')||'';if($('token').value)load();
</script></body></html>
