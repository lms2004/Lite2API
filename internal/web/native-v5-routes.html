<section id="view-routes" class="view native-view v9-page v9-routes">
  <header class="v9-page-head">
    <div class="v9-page-copy">
      <span class="v9-kicker">Routing studio</span>
      <h1>模型路由</h1>
      <p>一个客户端别名对应一条清晰的真实上游链；首选失败后才进入下一跳。</p>
    </div>
    <div class="actions route-actions">
      <span id="routeStatus" class="route-status"><span class="route-status-dot"></span>已同步</span>
      <details class="more-menu route-header-menu"><summary aria-label="更多路由操作"><svg class="icon" aria-hidden="true"><use href="#i-more"></use></svg></summary><div class="more-popover"><button onclick="openRouteJSON();this.closest('details').removeAttribute('open')">编辑路由 JSON</button></div></details>
      <button id="routeSaveBtn" class="primary" onclick="saveRoutes()" disabled>保存并热加载</button>
    </div>
  </header>

  <div id="routeChangeSummary" class="route-change-summary" hidden aria-live="polite"></div>

  <section class="v9-route-studio" aria-label="模型路由编辑器">
    <aside class="route-master">
      <div class="v9-master-title">
        <div><span class="v9-kicker">Client aliases</span><strong>客户端模型</strong></div>
        <button class="icon-btn" type="button" aria-label="添加模型路由" title="添加模型路由" onclick="addRoute()"><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg></button>
      </div>
      <nav id="v5RouteList" class="route-master-list" aria-label="选择模型路由"></nav>
      <div class="v9-master-foot">
        <span id="routeCount">0 条路由</span>
        <small>圆点表示当前可用性；选择后只编辑这一条链。</small>
      </div>
    </aside>

    <div class="route-detail">
      <div class="v9-detail-intro">
        <div><span class="v9-kicker">Selected route</span><strong>路由意图与真实上游链</strong></div>
        <div class="v9-route-legend"><span><i class="ready"></i>就绪</span><span><i class="warn"></i>需关注</span><span><i class="unknown"></i>尚未验证</span></div>
      </div>
      <div id="routeRows" class="route-chain-list"></div>
      <div class="v9-route-note"><svg class="icon" aria-hidden="true"><use href="#i-routes"></use></svg><span>网络错误、限流、鉴权失败、上游 5xx 或目标模型不存在时，才按顺序进入下一跳。</span></div>
    </div>
  </section>
</section>
