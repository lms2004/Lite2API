# Include inside the TLS server block for sub2api.foresights.top.
# The public data plane always requires a Lite2API key. The admin plane also
# requires the source to be loopback or the V2Ray server egress address.
location ^~ /lite/v1/ {
    rewrite ^/lite(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:45679;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location = /lite/v1 {
    return 308 /lite/v1/models;
}

location ^~ /lite/ {
    return 404;
}

# Old Sub2API is disabled. Keep the shared hostname useful without exposing
# any legacy route: root points to the authenticated Lite2API model list.
location = / {
    return 308 /lite/v1/models;
}

location / {
    return 404;
}

location = /lite-admin {
    return 404;
}

location ^~ /lite-admin/ {
    allow 127.0.0.1;
    allow ::1;
    allow 212.17.236.178;
    deny all;

    rewrite ^/lite-admin(/.*)$ /admin$1 break;
    proxy_pass http://127.0.0.1:45679;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /lite-admin;

    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
