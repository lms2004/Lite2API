name: ChatGPT Lite2API deployment preview

on:
  push:
    branches:
      - "feat/chatgpt-deploy-preview-20260819"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: chatgpt-lite2api-deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-and-capture:
    name: Build, deploy, verify, and capture admin UI
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact head revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build Lite2API
        shell: bash
        run: |
          set -euo pipefail
          go test ./...
          SOURCE_SHA="$(git rev-parse HEAD)"
          go build -trimpath -ldflags "-s -w -X main.version=${SOURCE_SHA}" -o "$RUNNER_TEMP/lite2api" ./cmd/lite2api
          "$RUNNER_TEMP/lite2api" -version | tee lite2api-version.txt
          printf '%s\n' "$SOURCE_SHA" | tee lite2api-commit.txt

      - name: Start deterministic mock upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mock_upstream.py" <<'PY'
          import json
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print("mock-upstream:", fmt % args, flush=True)

              def send_json(self, status, payload):
                  data = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(data)))
                  self.end_headers()
                  self.wfile.write(data)

              def do_GET(self):
                  if self.path.rstrip("/") == "/v1/models":
                      self.send_json(200, {
                          "object": "list",
                          "data": [{
                              "id": "deepseek-v4-flash",
                              "object": "model",
                              "created": 0,
                              "owned_by": "lite2api-ci"
                          }]
                      })
                      return
                  self.send_json(404, {"error": {"message": "not found"}})

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0") or "0")
                  if length:
                      self.rfile.read(length)
                  if self.path.rstrip("/") == "/v1/chat/completions":
                      self.send_json(200, {
                          "id": "chatcmpl-lite2api-ci",
                          "object": "chat.completion",
                          "created": int(time.time()),
                          "model": "deepseek-v4-flash",
                          "choices": [{
                              "index": 0,
                              "message": {
                                  "role": "assistant",
                                  "content": "Lite2API deployment probe OK"
                              },
                              "finish_reason": "stop"
                          }],
                          "usage": {
                              "prompt_tokens": 6,
                              "completion_tokens": 5,
                              "total_tokens": 11
                          }
                      })
                      return
                  self.send_json(404, {"error": {"message": "not found"}})

          ThreadingHTTPServer(("127.0.0.1", 45678), Handler).serve_forever()
          PY

          nohup python3 "$RUNNER_TEMP/mock_upstream.py" > mock-upstream.log 2>&1 &
          echo $! > mock-upstream.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:45678/v1/models > mock-models.json; then
              break
            fi
            sleep 1
          done
          test -s mock-models.json
          cat mock-models.json

      - name: Start isolated Lite2API service and verify routing
        shell: bash
        run: |
          set -euo pipefail
          cp config.example.json "$RUNNER_TEMP/lite2api-config.json"
          nohup env \
            LITE2API_API_KEYS="ci-preview-gateway-key-20260819" \
            LITE2API_ADMIN_TOKEN="ci-preview-admin-token-20260819" \
            LITE2API_ADMIN_AUTO_LOGIN="false" \
            LITE2API_ADMIN_ALLOWED_CIDRS="127.0.0.0/8,::1/128" \
            LITE2API_TRUSTED_PROXY_CIDRS="127.0.0.0/8,::1/128" \
            ATOMCODE2API_KEY="ci-preview-upstream-key" \
            "$RUNNER_TEMP/lite2api" -config "$RUNNER_TEMP/lite2api-config.json" \
            > lite2api-server.log 2>&1 &
          echo $! > lite2api-server.pid

          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error -o lite2api-health.json -w '%{http_code}' http://127.0.0.1:45679/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              if grep -q '"liveness":"ok"' lite2api-health.json; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Lite2API did not become live" >&2
            cat lite2api-server.log >&2 || true
            exit 1
          fi

          curl --fail --silent --show-error http://127.0.0.1:45679/admin > /dev/null
          curl --fail --silent --show-error \
            http://127.0.0.1:45679/v1/chat/completions \
            -H 'Authorization: Bearer ci-preview-gateway-key-20260819' \
            -H 'Content-Type: application/json' \
            -d '{"model":"deepseek-fast","messages":[{"role":"user","content":"deployment probe"}],"stream":false}' \
            | tee lite2api-probe-response.json
          grep -q 'Lite2API deployment probe OK' lite2api-probe-response.json

          curl --silent --show-error http://127.0.0.1:45679/health > lite2api-health.json
          cat lite2api-health.json

      - name: Capture authenticated live pages in Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found on runner" >&2
            exit 1
          fi
          echo "Using browser: $CHROME"

          mkdir -p "$RUNNER_TEMP/lite2api-browser"
          cd "$RUNNER_TEMP/lite2api-browser"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --silent playwright-core >/dev/null

          CHROME="$CHROME" OUTPUT_DIR="$GITHUB_WORKSPACE" node <<'NODE'
          const fs = require('node:fs');
          const { chromium } = require('playwright-core');

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--font-render-hinting=none'],
            });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              locale: 'zh-CN',
            });
            const page = await context.newPage();
            const diagnostics = [];
            page.on('console', (msg) => diagnostics.push(`[console:${msg.type()}] ${msg.text()}`));
            page.on('pageerror', (err) => diagnostics.push(`[pageerror] ${err.stack || err.message}`));
            page.on('requestfailed', (req) => diagnostics.push(`[requestfailed] ${req.method()} ${req.url()} ${req.failure()?.errorText || ''}`));

            await page.goto('http://127.0.0.1:45679/admin', { waitUntil: 'domcontentloaded', timeout: 30000 });
            const login = await page.evaluate(async () => {
              const response = await fetch('/admin/api/login', {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: 'ci-preview-admin-token-20260819' }),
              });
              return { status: response.status, body: await response.text() };
            });
            diagnostics.push(`[login] ${login.status} ${login.body}`);
            if (login.status !== 200) throw new Error(`admin login failed: ${login.status} ${login.body}`);

            await page.reload({ waitUntil: 'networkidle', timeout: 30000 });
            await page.waitForFunction(() => document.body && document.body.innerText.includes('Lite2API'), null, { timeout: 15000 });
            await page.waitForTimeout(3500);

            const session = await page.evaluate(async () => {
              const response = await fetch('/admin/api/session', { credentials: 'include' });
              return { status: response.status, body: await response.text() };
            });
            const state = await page.evaluate(async () => {
              const response = await fetch('/admin/api/state', { credentials: 'include' });
              return { status: response.status, body: await response.text() };
            });
            diagnostics.push(`[session] ${session.status} ${session.body}`);
            diagnostics.push(`[state] ${state.status} ${state.body.slice(0, 3000)}`);
            if (session.status !== 200 || state.status !== 200) throw new Error('authenticated admin API verification failed');

            async function capture(name, selector) {
              if (selector) {
                await page.locator(selector).click();
                await page.waitForTimeout(1800);
              }
              await page.screenshot({
                path: `${process.env.OUTPUT_DIR}/${name}`,
                fullPage: false,
              });
            }

            await capture('lite2api-admin-overview-1440.png', null);
            await capture('lite2api-admin-routes-1440.png', '[data-view="routes"]');
            await capture('lite2api-admin-accounts-1440.png', '[data-view="accounts"]');

            fs.writeFileSync(`${process.env.OUTPUT_DIR}/lite2api-admin-page.html`, await page.content());
            fs.writeFileSync(`${process.env.OUTPUT_DIR}/lite2api-browser-diagnostics.txt`, diagnostics.join('\n') + '\n');
            await browser.close();
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

          file "$GITHUB_WORKSPACE"/lite2api-admin-*-1440.png

      - name: Write deployment report
        if: always()
        shell: bash
        run: |
          SOURCE_SHA="$(cat lite2api-commit.txt 2>/dev/null || git rev-parse HEAD)"
          {
            echo "# Lite2API isolated deployment report"
            echo
            echo "- Repository: lms2004/Lite2API"
            echo "- Source commit: ${SOURCE_SHA}"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Build: go test ./... + go build ./cmd/lite2api"
            echo "- Service URL: http://127.0.0.1:45679"
            echo "- Health endpoint: /health"
            echo "- Admin endpoint: /admin"
            echo "- Browser: Playwright Core with runner Chromium/Chrome"
            echo "- Screenshot viewport: 1440 x 1000"
            echo "- End-to-end probe: client → Lite2API → mock OpenAI-compatible upstream"
            echo
            echo "## Health response"
            echo '```json'
            cat lite2api-health.json 2>/dev/null || true
            echo
            echo '```'
            echo
            echo "## Probe response"
            echo '```json'
            cat lite2api-probe-response.json 2>/dev/null || true
            echo
            echo '```'
            echo
            echo "## Server log tail"
            echo '```text'
            tail -n 120 lite2api-server.log 2>/dev/null || true
            echo '```'
          } > lite2api-deployment-report.md

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite2api-deploy-preview
          if-no-files-found: error
          retention-days: 1
          path: |
            lite2api-admin-overview-1440.png
            lite2api-admin-routes-1440.png
            lite2api-admin-accounts-1440.png
            lite2api-admin-page.html
            lite2api-browser-diagnostics.txt
            lite2api-deployment-report.md
            lite2api-health.json
            lite2api-probe-response.json
            lite2api-server.log
            mock-upstream.log
            mock-models.json
            lite2api-version.txt
            lite2api-commit.txt
