name: Temporary Native v10 QA CSRF patch

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v9-core-redesign-20260819
          fetch-depth: 1
      - name: Keep direct account-test probe CSRF-valid
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/admin-v10-product-qa.yml')
          text = path.read_text()
          old = """            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', { data: { token: 'preview-admin-token' } });
            if (!login.ok()) throw new Error(`admin login failed: ${login.status()} ${await login.text()}`);
"""
          new = """            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', { data: { token: 'preview-admin-token' } });
            const loginBody = await login.text();
            if (!login.ok()) throw new Error(`admin login failed: ${login.status()} ${loginBody}`);
            const loginData = JSON.parse(loginBody);
"""
          if 'const loginData = JSON.parse(loginBody);' not in text:
              if old not in text:
                  raise SystemExit('login anchor not found')
              text = text.replace(old, new, 1)

          old = """            const accountTest = await context.request.post('http://127.0.0.1:45679/admin/api/accounts/test', {
              data: { account: { id:'api-contract-test', name:'API Contract Test', type:'openai', base_url:'http://127.0.0.1:45678/v1', api_key:'preview', auth_header:'Authorization', auth_scheme:'Bearer', concurrency:1, weight:1, enabled:true } },
            });
"""
          new = """            const accountTest = await context.request.post('http://127.0.0.1:45679/admin/api/accounts/test', {
              headers: { 'X-CSRF-Token': loginData.csrf },
              data: { account: { id:'api-contract-test', name:'API Contract Test', type:'openai', base_url:'http://127.0.0.1:45678/v1', api_key:'preview', auth_header:'Authorization', auth_scheme:'Bearer', concurrency:1, weight:1, enabled:true } },
            });
"""
          if "headers: { 'X-CSRF-Token': loginData.csrf }" not in text:
              if old not in text:
                  raise SystemExit('account test anchor not found')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm .github/workflows/v10-qa-csrf-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/admin-v10-product-qa.yml .github/workflows/v10-qa-csrf-patch.yml
          git commit -m "ci: pass CSRF token to direct account test"
          git push origin HEAD:feat/admin-v9-core-redesign-20260819
