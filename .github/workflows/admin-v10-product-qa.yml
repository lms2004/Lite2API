name: Native v10 usage and account product QA

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"
  pull_request:
    branches:
      - main
    paths:
      - "internal/web/**"
      - "internal/gateway/accounttest.go"
      - "internal/gateway/admin.go"
      - ".github/workflows/admin-v10-product-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v10-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live-product-acceptance:
    name: Build, seed, exercise onboarding, and capture
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build Lite2API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          go test ./... 2>&1 | tee evidence/go-test.log
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "$RUNNER_TEMP/lite2api" ./cmd/lite2api
          "$RUNNER_TEMP/lite2api" -version | tee evidence/lite2api-version.txt
          git rev-parse HEAD | tee evidence/source-commit.txt

      - name: Write live preview configuration
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/lite2api-v10-preview.json" <<'JSON'
          {
            "server": {
              "listen": "127.0.0.1:45679",
              "api_key_env": "LITE2API_API_KEYS",
              "admin_token_env": "LITE2API_ADMIN_TOKEN",
              "client_keys_path": "client_keys.v10-preview.json",
              "admin_allowed_cidrs": ["127.0.0.0/8", "::1/128"],
              "trusted_proxy_cidrs": ["127.0.0.0/8", "::1/128"],
              "admin_session_ttl": "30m",
              "max_body_bytes": 8388608,
              "max_inflight_requests": 64,
              "request_read_timeout": "30s",
              "queue_timeout": "30s",
              "response_header_timeout": "30s",
              "stream_idle_timeout": "2m",
              "idle_conn_timeout": "90s",
              "max_idle_conns": 128,
              "max_idle_conns_per_host": 64,
              "max_conns_per_host": 64,
              "failure_threshold": 3,
              "circuit_cooldown": "30s",
              "max_failover_attempts": 3,
              "allow_private_http_upstream": true,
              "request_log_path": "request.v10-preview.log",
              "request_log_max_bytes": 8388608,
              "request_log_backups": 1
            },
            "accounts": [
              {
                "id": "fast-lane",
                "name": "Codex Fast Lane",
                "type": "openai",
                "adapter_id": "generic-openai",
                "instance_id": "fast",
                "operations": ["openai.chat"],
                "base_url": "http://127.0.0.1:45678/v1",
                "api_key_env": "PREVIEW_FAST_KEY",
                "models": ["gpt-5.6-codex-fast"],
                "capabilities": [{"model":"fast","upstream_model":"gpt-5.6-codex-fast","reasoning_efforts":["auto","low","medium","high"]}],
                "priority": 0,
                "weight": 3,
                "concurrency": 12,
                "enabled": true
              },
              {
                "id": "claude-steady",
                "name": "Claude Steady",
                "type": "openai",
                "adapter_id": "generic-openai",
                "instance_id": "steady",
                "operations": ["openai.chat"],
                "base_url": "http://127.0.0.1:45680/v1",
                "api_key_env": "PREVIEW_CLAUDE_KEY",
                "models": ["claude-sonnet-4-6"],
                "capabilities": [{"model":"claude","upstream_model":"claude-sonnet-4-6","reasoning_efforts":["auto","low","medium","high"]}],
                "priority": 0,
                "weight": 2,
                "concurrency": 8,
                "enabled": true
              },
              {
                "id": "gemini-vision",
                "name": "Gemini Vision",
                "type": "openai",
                "adapter_id": "gemini-openai",
                "instance_id": "vision",
                "operations": ["openai.chat"],
                "base_url": "http://127.0.0.1:45681/v1",
                "api_key_env": "PREVIEW_GEMINI_KEY",
                "models": ["gemini-3.6-pro-vision"],
                "capabilities": [{"model":"vision","upstream_model":"gemini-3.6-pro-vision","reasoning_efforts":["auto","medium","high"]}],
                "priority": 0,
                "weight": 2,
                "concurrency": 6,
                "enabled": true
              },
              {
                "id": "grok-flaky",
                "name": "Grok Canary",
                "type": "openai",
                "adapter_id": "generic-openai",
                "instance_id": "canary",
                "operations": ["openai.chat"],
                "base_url": "http://127.0.0.1:45683/v1",
                "api_key_env": "PREVIEW_GROK_KEY",
                "models": ["grok-4.5"],
                "capabilities": [{"model":"grok","upstream_model":"grok-4.5","reasoning_efforts":["auto","low","medium","high"]}],
                "priority": 0,
                "weight": 1,
                "concurrency": 3,
                "enabled": true
              }
            ],
            "routes": {
              "fast": {"model":"fast","reasoning_effort":"medium","targets":[{"account":"fast-lane"}]},
              "claude": {"model":"claude","reasoning_effort":"high","targets":[{"account":"claude-steady"}]},
              "vision": {"model":"vision","reasoning_effort":"high","targets":[{"account":"gemini-vision"}]},
              "grok": {"model":"grok","reasoning_effort":"high","targets":[{"account":"grok-flaky"}]}
            }
          }
          JSON
          "$RUNNER_TEMP/lite2api" -config "$RUNNER_TEMP/lite2api-v10-preview.json" -check-config | tee evidence/config-check.txt

      - name: Start model and quota fixtures
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/v10_fixtures.py" <<'PY'
          import json
          import threading
          import time
          from datetime import datetime, timedelta, timezone
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          PROFILES = {
              45678: {"name": "Codex Fast Lane", "models": ["gpt-5.6-codex-fast"], "delay": 0.055, "flaky": False},
              45680: {"name": "Claude Steady", "models": ["claude-sonnet-4-6"], "delay": 0.150, "flaky": False},
              45681: {"name": "Gemini Vision", "models": ["gemini-3.6-pro-vision"], "delay": 0.360, "flaky": False},
              45683: {"name": "Grok Canary", "models": ["grok-4.5"], "delay": 0.095, "flaky": True},
          }
          COUNTERS = {port: 0 for port in PROFILES}

          def iso(hours=0):
              return (datetime.now(timezone.utc) + timedelta(hours=hours)).isoformat().replace("+00:00", "Z")

          class ModelHandler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print(f"model:{self.server.server_port}: " + (fmt % args), flush=True)

              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  profile = PROFILES[self.server.server_port]
                  if self.path.rstrip("/") == "/v1/models":
                      self.send_json(200, {"object":"list","data":[{"id":model,"object":"model","owned_by":profile["name"]} for model in profile["models"]]})
                      return
                  self.send_json(404, {"error":{"message":"not found"}})

              def do_POST(self):
                  profile = PROFILES[self.server.server_port]
                  length = int(self.headers.get("Content-Length", "0") or "0")
                  raw = self.rfile.read(length) if length else b"{}"
                  try:
                      request = json.loads(raw.decode("utf-8"))
                  except Exception:
                      request = {}
                  if self.path.rstrip("/") != "/v1/chat/completions":
                      self.send_json(404, {"error":{"message":"not found"}})
                      return
                  COUNTERS[self.server.server_port] += 1
                  time.sleep(profile["delay"])
                  if profile["flaky"] and COUNTERS[self.server.server_port] % 3 == 0:
                      self.send_json(503, {"error":{"message":"Canary quality probe failed","type":"upstream_error"}})
                      return
                  model = request.get("model") or profile["models"][0]
                  prompt_tokens = 24 + len(json.dumps(request.get("messages") or [], ensure_ascii=False)) // 12
                  output_tokens = 3 if "只回复 OK" in raw.decode("utf-8", errors="ignore") else 18
                  content = "OK" if output_tokens == 3 else f"{profile['name']} response"
                  self.send_json(200, {
                      "id": f"chatcmpl-v10-{self.server.server_port}-{COUNTERS[self.server.server_port]}",
                      "object": "chat.completion",
                      "created": int(time.time()),
                      "model": model,
                      "choices": [{"index":0,"message":{"role":"assistant","content":content},"finish_reason":"stop"}],
                      "usage": {"prompt_tokens":prompt_tokens,"completion_tokens":output_tokens,"total_tokens":prompt_tokens+output_tokens,"prompt_tokens_details":{"cached_tokens":prompt_tokens//4}}
                  })

          class OAuthHandler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print("oauth: " + (fmt % args), flush=True)

              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path.split("?", 1)[0] != "/v0/management/auth-files":
                      self.send_json(404, {"error":"not found"})
                      return
                  self.send_json(200, {"files": [
                      {"id":"codex-a.json","auth_index":"codex-a","provider":"openai","label":"owner@studio.example","account_type":"ChatGPT Team","status":"active","success":1842,"failed":9,"updated_at":iso(-1),"quota_windows":[{"kind":"five_hour","label":"5 小时","used_percentage":38.0,"reset_at":iso(2),"observed_at":iso(0),"source":"provider"},{"kind":"seven_day","label":"7 天","used_percentage":61.0,"reset_at":iso(96),"observed_at":iso(0),"source":"provider"}]},
                      {"id":"codex-b.json","auth_index":"codex-b","provider":"openai","label":"backup@studio.example","account_type":"ChatGPT Pro","status":"active","success":936,"failed":4,"updated_at":iso(-1),"quota_windows":[{"kind":"five_hour","label":"5 小时","used_percentage":72.0,"reset_at":iso(1),"observed_at":iso(0),"source":"provider"},{"kind":"seven_day","label":"7 天","used_percentage":44.0,"reset_at":iso(72),"observed_at":iso(0),"source":"provider"}]},
                      {"id":"claude.json","auth_index":"claude-a","provider":"claude","label":"research@studio.example","account_type":"Claude Max","status":"active","success":1210,"failed":11,"updated_at":iso(-1),"quota_windows":[{"kind":"five_hour","label":"5 小时","used_percentage":54.0,"reset_at":iso(3),"observed_at":iso(0),"source":"provider"},{"kind":"seven_day_sonnet","label":"Sonnet 周","used_percentage":84.0,"reset_at":iso(58),"observed_at":iso(0),"source":"provider"}]},
                      {"id":"gemini.json","auth_index":"gemini-a","provider":"gemini-cli","label":"vision@studio.example","account_type":"Workspace","status":"active","success":702,"failed":6,"updated_at":iso(-1),"quota_windows":[{"kind":"daily","label":"每日","used_percentage":46.0,"reset_at":iso(9),"observed_at":iso(0),"source":"provider"}]},
                      {"id":"antigravity.json","auth_index":"anti-a","provider":"antigravity","label":"preview@studio.example","account_type":"Preview","status":"unavailable","unavailable":true,"success":88,"failed":17,"updated_at":iso(-1),"next_retry_after":iso(2),"quota":{"exceeded":true},"quota_windows":[{"kind":"model_cooldown","label":"模型冷却","status":"cooldown","reset_at":iso(2),"observed_at":iso(0),"source":"provider"}]}
                  ]})

          servers = []
          for port in PROFILES:
              server = ThreadingHTTPServer(("127.0.0.1", port), ModelHandler)
              threading.Thread(target=server.serve_forever, daemon=True).start()
              servers.append(server)
          oauth = ThreadingHTTPServer(("127.0.0.1", 45682), OAuthHandler)
          threading.Thread(target=oauth.serve_forever, daemon=True).start()
          servers.append(oauth)
          print("fixtures ready", flush=True)
          while True:
              time.sleep(60)
          PY

          nohup python3 -u "$RUNNER_TEMP/v10_fixtures.py" > evidence/fixtures.log 2>&1 &
          echo $! > evidence/fixtures.pid
          for port in 45678 45680 45681 45683; do
            ready=0
            for attempt in $(seq 1 30); do
              if curl --silent --show-error --fail "http://127.0.0.1:${port}/v1/models" > "evidence/models-${port}.json"; then ready=1; break; fi
              sleep 1
            done
            test "$ready" = "1"
          done

      - name: Deploy Lite2API and seed real usage
        shell: bash
        run: |
          set -euo pipefail
          nohup env \
            LITE2API_API_KEYS="preview-client-key" \
            LITE2API_ADMIN_TOKEN="preview-admin-token" \
            LITE2API_ADMIN_AUTO_LOGIN="false" \
            LITE2API_ADMIN_ALLOWED_CIDRS="127.0.0.0/8,::1/128" \
            LITE2API_TRUSTED_PROXY_CIDRS="127.0.0.0/8,::1/128" \
            PREVIEW_FAST_KEY="preview" \
            PREVIEW_CLAUDE_KEY="preview" \
            PREVIEW_GEMINI_KEY="preview" \
            PREVIEW_GROK_KEY="preview" \
            CLIPROXYAPI_MANAGEMENT_KEY="preview-management-key" \
            "$RUNNER_TEMP/lite2api" -config "$RUNNER_TEMP/lite2api-v10-preview.json" \
            > evidence/lite2api-server.log 2>&1 &
          echo $! > evidence/lite2api-server.pid

          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error --output evidence/health.json --write-out '%{http_code}' http://127.0.0.1:45679/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then break; fi
            sleep 1
          done

          seed() {
            model="$1"
            index="$2"
            curl --silent --show-error \
              --output "evidence/seed-${model}-${index}.json" \
              http://127.0.0.1:45679/v1/chat/completions \
              -H 'Authorization: Bearer preview-client-key' \
              -H 'Content-Type: application/json' \
              --data "{\"model\":\"${model}\",\"messages\":[{\"role\":\"user\",\"content\":\"Usage seed ${index}\"}],\"stream\":false}"
          }
          for i in $(seq 1 14); do seed fast "$i"; done
          for i in $(seq 1 9); do seed claude "$i"; done
          for i in $(seq 1 6); do seed vision "$i"; done
          sleep 2
          curl --silent --show-error http://127.0.0.1:45679/health > evidence/health-after-seed.json

      - name: Install Chromium and Chinese fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > evidence/font-install.log
          fc-cache -f
          fc-match 'Noto Sans CJK SC' | tee evidence/font-match.txt
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          printf '%s\n' "$CHROME" > evidence/browser-executable.txt
          mkdir -p "$RUNNER_TEMP/browser"
          cd "$RUNNER_TEMP/browser"
          npm init -y > "$GITHUB_WORKSPACE/evidence/npm-init.log" 2>&1
          npm install --no-audit --no-fund playwright-core 2>&1 | tee "$GITHUB_WORKSPACE/evidence/playwright-install.log"

      - name: Exercise and capture Native v10 workflows
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/browser/capture.js" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright-core');

          const output = process.env.OUTPUT_DIR;
          const diagnostics = [];
          const record = message => {
            const line = `${new Date().toISOString()} ${message}`;
            diagnostics.push(line);
            fs.writeFileSync(path.join(output, 'browser-diagnostics.txt'), diagnostics.join('\n') + '\n');
            console.log(line);
          };

          function trendFixture() {
            const calls = [24,31,28,38,42,47,55,63,58,71,84,79,96,102,111,108,126,139,132,118,104,91,77,69];
            const failed = [0,1,0,1,1,0,2,1,0,1,2,1,1,0,2,1,1,2,1,1,0,1,0,1];
            const p95 = [520,560,540,610,590,650,690,720,680,760,820,790,850,890,940,910,980,1040,990,920,860,790,710,660];
            const now = Date.now();
            return {
              range_seconds: 86400,
              bucket_seconds: 3600,
              retention_seconds: 604800,
              points: calls.map((requests, index) => ({
                time: new Date(now - (calls.length - 1 - index) * 3600000).toISOString(),
                requests,
                failed: failed[index],
                p95_latency_ms: p95[index],
              })),
            };
          }

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              executablePath: process.env.CHROME,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--font-render-hinting=none'],
            });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              locale: 'zh-CN',
              colorScheme: 'light',
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            page.on('console', message => record(`[console:${message.type()}] ${message.text()}`));
            page.on('pageerror', error => record(`[pageerror] ${error.stack || error.message}`));
            page.on('requestfailed', request => record(`[requestfailed] ${request.method()} ${request.url()} ${request.failure()?.errorText || ''}`));

            await page.route('**/admin/api/trends?*', async route => {
              await route.fulfill({ status: 200, contentType: 'application/json', body: JSON.stringify(trendFixture()) });
            });

            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', { data: { token: 'preview-admin-token' } });
            if (!login.ok()) throw new Error(`admin login failed: ${login.status()} ${await login.text()}`);

            await page.goto('http://127.0.0.1:45679/admin', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForSelector('#view-monitor.active .v10-kpi-strip', { state: 'visible', timeout: 30000 });
            await page.waitForFunction(() => document.querySelectorAll('#v10QuotaBoard .v10-quota-account').length >= 5, null, { timeout: 30000 });
            await page.waitForFunction(() => document.querySelector('#v10CallCount')?.textContent !== '—', null, { timeout: 30000 });
            await page.waitForTimeout(1200);
            await page.screenshot({ path: path.join(output, 'v10-usage-before-quality.png'), fullPage: false, animations: 'disabled' });

            await page.locator('#v10TestAllChannels').click();
            await page.waitForFunction(() => {
              const rows = [...document.querySelectorAll('#v10QualityRows .v10-quality-row')];
              return rows.length >= 4 && rows.every(row => !row.classList.contains('is-running') && !row.innerText.includes('未测试'));
            }, null, { timeout: 90000 });
            await page.screenshot({ path: path.join(output, 'v10-usage-quality-results.png'), fullPage: false, animations: 'disabled' });
            await page.screenshot({ path: path.join(output, 'v10-usage-full.png'), fullPage: true, animations: 'disabled' });
            record('[capture] usage and channel quality');

            await page.locator('button[data-view="accounts"]').click();
            await page.waitForSelector('#view-accounts.active .v10-account-workspace', { state: 'visible', timeout: 20000 });
            await page.waitForFunction(() => document.querySelectorAll('#oauthAccounts .channel-account').length >= 5, null, { timeout: 30000 });
            await page.screenshot({ path: path.join(output, 'v10-accounts.png'), fullPage: false, animations: 'disabled' });

            await page.getByRole('button', { name: '添加账号' }).click();
            await page.waitForSelector('#quickAuthDialog[open] #v10ProviderGrid', { state: 'visible', timeout: 10000 });
            const providers = [...await page.locator('#v10ProviderGrid [data-v10-provider]').all()];
            const providerChecks = [];
            for (const providerButton of providers) {
              const provider = await providerButton.getAttribute('data-v10-provider');
              await providerButton.click();
              const methods = await page.locator('#v10MethodGrid .v10-method-card').count();
              const summary = await page.locator('#v10ProviderSummary').innerText();
              if (!methods || !summary.trim()) throw new Error(`provider ${provider} has no onboarding methods`);
              providerChecks.push({ provider, methods, summary });
            }
            fs.writeFileSync(path.join(output, 'provider-onboarding-checks.json'), JSON.stringify(providerChecks, null, 2));
            await page.locator('[data-v10-provider="anthropic"]').click();
            await page.screenshot({ path: path.join(output, 'v10-add-account-claude.png'), fullPage: false, animations: 'disabled' });
            await page.locator('[data-v10-provider="gemini"]').click();
            await page.screenshot({ path: path.join(output, 'v10-add-account-gemini.png'), fullPage: false, animations: 'disabled' });

            await page.locator('[data-v10-provider="deepseek"]').click();
            await page.getByRole('button', { name: 'DeepSeek API Key' }).click();
            await page.waitForSelector('#accountDialog[open] #v10TestAccountBtn', { state: 'visible', timeout: 10000 });
            await page.locator('#accountForm input[name="name"]').fill('Preview Local API');
            await page.locator('#accountForm input[name="base_url"]').fill('http://127.0.0.1:45678/v1');
            await page.locator('#accountForm input[name="api_key"]').fill('preview');
            await page.locator('#v10TestAccountBtn').click();
            await page.waitForFunction(() => document.querySelector('#v10AccountTestResult')?.classList.contains('good'), null, { timeout: 20000 });
            await page.screenshot({ path: path.join(output, 'v10-manual-account-tested.png'), fullPage: false, animations: 'disabled' });
            record('[capture] provider onboarding and pre-save test');

            await page.locator('#accountDialog .close-btn').click();
            await page.getByRole('button', { name: '批量导入' }).click();
            await page.waitForSelector('#importDialog[open] #importFileInput', { state: 'attached', timeout: 10000 });
            const importPayload = {
              type: 'lite2api-data',
              version: 1,
              accounts: [{
                id: 'import-preview',
                name: 'Imported Preview',
                type: 'openai',
                base_url: 'http://127.0.0.1:45678/v1',
                api_key: 'preview-import-key',
                models: ['gpt-5.6-codex-fast'],
                concurrency: 2,
                priority: 0,
                weight: 1,
                enabled: true,
              }],
              proxies: [],
            };
            await page.locator('#importFileInput').setInputFiles({
              name: 'lite2api-preview-import.json',
              mimeType: 'application/json',
              buffer: Buffer.from(JSON.stringify(importPayload)),
            });
            await page.locator('#previewImportBtn').click();
            await page.waitForFunction(() => {
              const result = document.querySelector('#importResult');
              return result && !result.hidden && document.querySelector('#resultCreated')?.textContent === '1';
            }, null, { timeout: 20000 });
            await page.screenshot({ path: path.join(output, 'v10-import-dry-run.png'), fullPage: false, animations: 'disabled' });
            record('[capture] import dry run');

            const accountTest = await context.request.post('http://127.0.0.1:45679/admin/api/accounts/test', {
              data: { account: { id:'api-contract-test', name:'API Contract Test', type:'openai', base_url:'http://127.0.0.1:45678/v1', api_key:'preview', auth_header:'Authorization', auth_scheme:'Bearer', concurrency:1, weight:1, enabled:true } },
            });
            fs.writeFileSync(path.join(output, 'account-test-response.json'), await accountTest.text());
            if (!accountTest.ok()) throw new Error(`account test endpoint failed: ${accountTest.status()}`);

            fs.writeFileSync(path.join(output, 'rendered-admin.html'), await page.content());
            await browser.close();
          })().catch(error => {
            record(`[fatal] ${error.stack || error.message || error}`);
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

          cd "$RUNNER_TEMP/browser"
          CHROME="$(cat "$GITHUB_WORKSPACE/evidence/browser-executable.txt")" \
            OUTPUT_DIR="$GITHUB_WORKSPACE/evidence" \
            node capture.js 2>&1 | tee "$GITHUB_WORKSPACE/evidence/playwright-run.log"
          file "$GITHUB_WORKSPACE/evidence"/*.png | tee "$GITHUB_WORKSPACE/evidence/screenshot-files.txt"
          sha256sum "$GITHUB_WORKSPACE/evidence"/*.png | tee "$GITHUB_WORKSPACE/evidence/screenshot-sha256.txt"

      - name: Write product acceptance report
        if: always()
        shell: bash
        run: |
          {
            echo "# Lite2API Native v10 product acceptance"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Real runtime: Lite2API binary on 127.0.0.1:45679"
            echo "- Real model fixtures: four OpenAI-compatible upstreams with distinct latency and one controlled flaky channel"
            echo "- Real quota fixture: five OAuth credentials with 5h, 7d, daily, warning, and cooldown states"
            echo "- Verified workflows: usage KPIs, quota board, curves, 3-run channel quality, all provider onboarding branches, pre-save connection test, and import dry-run"
            echo "- Trend history: deterministic 24-hour fixture intercepted only for visual acceptance"
            echo
            echo "## Health after seed"
            echo '```json'
            cat evidence/health-after-seed.json 2>/dev/null || true
            echo
            echo '```'
            echo
            echo "## Browser diagnostics"
            echo '```text'
            cat evidence/browser-diagnostics.txt 2>/dev/null || true
            echo '```'
          } > evidence/v10-product-acceptance.md
          find evidence -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > evidence/file-list.txt

      - name: Upload Native v10 product evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite2api-native-v10-product-acceptance
          retention-days: 3
          if-no-files-found: error
          path: evidence/
