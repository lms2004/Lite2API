name: Temporary Native v10 account-test route patch

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v9-core-redesign-20260819
          fetch-depth: 1
      - name: Register pre-save account test endpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path = Path('internal/gateway/admin.go')
          text = path.read_text()
          anchor = '''\tcase path == "/accounts/export" && r.Method == http.MethodPost:\n'''
          addition = '''\tcase path == "/accounts/test" && r.Method == http.MethodPost:\n\t\tg.serveAccountTest(w, r, state)\n'''
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('admin account route anchor not found')
              text = text.replace(anchor, addition + anchor, 1)
              path.write_text(text)
          PY
          rm .github/workflows/v10-account-test-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/gateway/admin.go .github/workflows/v10-account-test-patch.yml
          git commit -m "feat: register pre-save upstream connection test"
          git push origin HEAD:feat/admin-v9-core-redesign-20260819
