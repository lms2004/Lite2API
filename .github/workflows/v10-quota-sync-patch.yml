name: Temporary Native v10 quota sync patch

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v9-core-redesign-20260819
          fetch-depth: 1
      - name: Make quota a first-class usage-page dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('internal/web/native-v10.js')
          text = path.read_text()

          old = """  let selectedOnboardingProvider = 'codex';
  let syncScheduled = false;
"""
          new = """  let selectedOnboardingProvider = 'codex';
  let syncScheduled = false;
  let quotaLoadBusy = false;
  let quotaLoadedAt = 0;
"""
          if 'let quotaLoadBusy = false;' not in text:
              if old not in text:
                  raise SystemExit('quota state anchor not found')
              text = text.replace(old, new, 1)

          anchor = """  function syncAll() {
    syncScheduled = false;
"""
          addition = """  async function ensureQuotaAccounts(force = false) {
    if (quotaLoadBusy) return;
    if (!force && Date.now() - quotaLoadedAt < 60000) return;
    quotaLoadBusy = true;
    try {
      const response = await api('/oauth/accounts');
      state.oauth_accounts = response.data || [];
      state.oauth_error = response.warning || '';
      quotaLoadedAt = Date.now();
      syncQuotaBoard();
    } catch (error) {
      state.oauth_error = error.message || '认证适配器当前不可读';
      quotaLoadedAt = Date.now();
      syncQuotaBoard();
    } finally {
      quotaLoadBusy = false;
    }
  }

  function syncAll() {
    syncScheduled = false;
"""
          if 'async function ensureQuotaAccounts' not in text:
              if anchor not in text:
                  raise SystemExit('syncAll anchor not found')
              text = text.replace(anchor, addition, 1)

          old = """    syncUsageMetrics();
    syncQuotaBoard();
"""
          new = """    syncUsageMetrics();
    syncQuotaBoard();
    if (typeof activeViewName === 'undefined' || activeViewName === 'monitor') {
      void ensureQuotaAccounts(false);
    }
"""
          if new not in text:
              if old not in text:
                  raise SystemExit('quota sync call anchor not found')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/v10-quota-sync-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/native-v10.js .github/workflows/v10-quota-sync-patch.yml
          git commit -m "fix: load OAuth quota on the usage page"
          git push origin HEAD:feat/admin-v9-core-redesign-20260819
