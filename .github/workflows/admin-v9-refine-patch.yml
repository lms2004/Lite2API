name: Temporary Native v9 visual QA refinement

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"
      - "chore/admin-v9-refine-runner-20260819"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/admin-v9-refine-patch.yml"
      - ".github/workflows/admin-v9-visual-qa.yml"
      - ".github/workflows/ui-quality.yml"
      - "internal/web/**"

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-v9-core-redesign-20260819
          fetch-depth: 1

      - name: Refine the seeded screenshot pass
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/admin-v9-visual-qa.yml')
          text = path.read_text()
          marker = 'Fresh screenshot probes keep the operational window current.'

          if marker not in text:
              login_anchor = "            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', {"
              if login_anchor not in text:
                  raise SystemExit('login insertion anchor not found')
              probe = """            // Fresh screenshot probes keep the operational window current.
            // The final successful request proves recovery, while Native v9 keeps
            // the preceding Grok failure visible in the incident surface.
            async function previewProbe(model, label) {
              const response = await context.request.post('http://127.0.0.1:45679/v1/chat/completions', {
                headers: {
                  Authorization: 'Bearer preview-client-key',
                  'Content-Type': 'application/json',
                },
                data: {
                  model,
                  messages: [{ role: 'user', content: `Fresh visual probe ${label}` }],
                  stream: false,
                },
              });
              record(`[fresh-probe] ${model} ${response.status()}`);
              await response.body();
            }
            for (const [model, label] of [
              ['deepseek', 'fallback evidence'],
              ['claude', 'Claude route'],
              ['gemini', 'Gemini route'],
              ['vision', 'vision route'],
              ['grok', 'intentional canary incident'],
              ['sol', 'final recovery request'],
            ]) {
              await previewProbe(model, label);
            }

"""
              text = text.replace(login_anchor, probe + login_anchor, 1)

              overview_capture = "            await page.screenshot({ path: path.join(output, 'lite2api-v9-overview-1440.png'), fullPage: false, animations: 'disabled' });"
              if overview_capture not in text:
                  raise SystemExit('overview screenshot anchor not found')
              text = text.replace(
                  overview_capture,
                  overview_capture + "\n            await page.screenshot({ path: path.join(output, 'lite2api-v9-overview-full.png'), fullPage: true, animations: 'disabled' });",
                  1,
              )

              route_wait = "            await page.waitForTimeout(1500);"
              route_capture = "            await page.screenshot({ path: path.join(output, 'lite2api-v9-routes-1440.png'), fullPage: false, animations: 'disabled' });"
              if route_wait not in text or route_capture not in text:
                  raise SystemExit('route screenshot anchor not found')
              text = text.replace(
                  route_wait,
                  "            await page.waitForTimeout(900);\n            await page.evaluate(() => document.activeElement?.blur());",
                  1,
              )
              text = text.replace(
                  route_capture,
                  route_capture + "\n            await page.screenshot({ path: path.join(output, 'lite2api-v9-routes-full.png'), fullPage: true, animations: 'disabled' });",
                  1,
              )

              upstream_capture = "            await page.screenshot({ path: path.join(output, 'lite2api-v9-upstreams-1440.png'), fullPage: false, animations: 'disabled' });"
              if upstream_capture not in text:
                  raise SystemExit('upstream screenshot anchor not found')
              text = text.replace(
                  upstream_capture,
                  upstream_capture + "\n            await page.screenshot({ path: path.join(output, 'lite2api-v9-upstreams-full.png'), fullPage: true, animations: 'disabled' });",
                  1,
              )

              text = text.replace(
                  '- Screenshots: overview, routes, upstreams at 1440 x 1000',
                  '- Screenshots: overview, routes, upstreams in both 1440 x 1000 and full-page forms',
                  1,
              )
              path.write_text(text)
          PY

          rm .github/workflows/admin-v9-refine-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/admin-v9-visual-qa.yml .github/workflows/admin-v9-refine-patch.yml
          git commit -m "ci: refine seeded Native v9 screenshot evidence"
          git push origin HEAD:feat/admin-v9-core-redesign-20260819
