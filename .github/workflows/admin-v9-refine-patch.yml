name: Temporary Native v9 visual QA refinement

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: feat/admin-v9-core-redesign-20260819
          fetch-depth: 1

      - name: Refine the seeded screenshot pass
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/admin-v9-visual-qa.yml')
          text = path.read_text()
          marker = 'Fresh screenshot probes keep the operational window current.'
          if marker not in text:
              old = """            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', {
              data: { token: 'preview-admin-token' },
            });"""
              new = """            // Fresh screenshot probes keep the operational window current.
            // The final successful request proves recovery, while Native v9 keeps
            // the preceding Grok failure visible in the incident surface.
            async function previewProbe(model, label) {
              const response = await context.request.post('http://127.0.0.1:45679/v1/chat/completions', {
                headers: {
                  Authorization: 'Bearer preview-client-key',
                  'Content-Type': 'application/json',
                },
                data: {
                  model,
                  messages: [{ role: 'user', content: `Fresh visual probe ${label}` }],
                  stream: false,
                },
              });
              record(`[fresh-probe] ${model} ${response.status()}`);
              await response.body();
            }
            for (const [model, label] of [
              ['deepseek', 'fallback evidence'],
              ['claude', 'Claude route'],
              ['gemini', 'Gemini route'],
              ['vision', 'vision route'],
              ['grok', 'intentional canary incident'],
              ['sol', 'final recovery request'],
            ]) {
              await previewProbe(model, label);
            }

            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', {
              data: { token: 'preview-admin-token' },
            });"""
              if old not in text:
                  raise SystemExit('login insertion anchor not found')
              text = text.replace(old, new, 1)

              old = """            await page.screenshot({ path: path.join(output, 'lite2api-v9-overview-1440.png'), fullPage: false, animations: 'disabled' });
            record('[capture] overview');"""
              new = """            await page.screenshot({ path: path.join(output, 'lite2api-v9-overview-1440.png'), fullPage: false, animations: 'disabled' });
            await page.screenshot({ path: path.join(output, 'lite2api-v9-overview-full.png'), fullPage: true, animations: 'disabled' });
            record('[capture] overview');"""
              if old not in text:
                  raise SystemExit('overview screenshot anchor not found')
              text = text.replace(old, new, 1)

              old = """            if (await deepseek.count()) await deepseek.click();
            await page.waitForTimeout(1500);
            await page.screenshot({ path: path.join(output, 'lite2api-v9-routes-1440.png'), fullPage: false, animations: 'disabled' });
            record('[capture] routes');"""
              new = """            if (await deepseek.count()) await deepseek.click();
            await page.waitForTimeout(900);
            await page.evaluate(() => document.activeElement?.blur());
            await page.screenshot({ path: path.join(output, 'lite2api-v9-routes-1440.png'), fullPage: false, animations: 'disabled' });
            await page.screenshot({ path: path.join(output, 'lite2api-v9-routes-full.png'), fullPage: true, animations: 'disabled' });
            record('[capture] routes');"""
              if old not in text:
                  raise SystemExit('route screenshot anchor not found')
              text = text.replace(old, new, 1)

              old = """            await page.screenshot({ path: path.join(output, 'lite2api-v9-upstreams-1440.png'), fullPage: false, animations: 'disabled' });
            record('[capture] upstreams');"""
              new = """            await page.screenshot({ path: path.join(output, 'lite2api-v9-upstreams-1440.png'), fullPage: false, animations: 'disabled' });
            await page.screenshot({ path: path.join(output, 'lite2api-v9-upstreams-full.png'), fullPage: true, animations: 'disabled' });
            record('[capture] upstreams');"""
              if old not in text:
                  raise SystemExit('upstream screenshot anchor not found')
              text = text.replace(old, new, 1)

              text = text.replace(
                  '- Screenshots: overview, routes, upstreams at 1440 x 1000',
                  '- Screenshots: overview, routes, upstreams in both 1440 x 1000 and full-page forms',
                  1,
              )
              path.write_text(text)
          PY

          rm .github/workflows/admin-v9-refine-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/admin-v9-visual-qa.yml .github/workflows/admin-v9-refine-patch.yml
          git commit -m "ci: refine seeded Native v9 screenshot evidence"
          git push origin HEAD:feat/admin-v9-core-redesign-20260819
