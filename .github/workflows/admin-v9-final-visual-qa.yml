name: Native v9 final visual acceptance

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"
  pull_request:
    branches:
      - main
    paths:
      - "internal/web/**"
      - ".github/workflows/admin-v9-final-visual-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v9-final-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-live-capture:
    name: Build live service and capture deterministic core pages
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout redesign
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build Lite2API
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          go test ./... 2>&1 | tee evidence/go-test.log
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/lite2api" \
            ./cmd/lite2api
          "$RUNNER_TEMP/lite2api" -version | tee evidence/lite2api-version.txt
          git rev-parse HEAD | tee evidence/source-commit.txt

      - name: Start a real OpenAI-compatible upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/live_upstream.py" <<'PY'
          import json
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, fmt, *args):
                  print("live-upstream: " + (fmt % args), flush=True)

              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path.rstrip("/") == "/v1/models":
                      self.send_json(200, {
                          "object": "list",
                          "data": [
                              {"id": "deepseek-v4-flash", "object": "model", "owned_by": "native-v9-qa"},
                              {"id": "Qwen/Qwen3-VL-8B-Instruct", "object": "model", "owned_by": "native-v9-qa"}
                          ]
                      })
                      return
                  self.send_json(404, {"error": {"message": "not found"}})

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0") or "0")
                  raw = self.rfile.read(length) if length else b"{}"
                  try:
                      request = json.loads(raw.decode("utf-8"))
                  except Exception:
                      request = {}
                  if self.path.rstrip("/") != "/v1/chat/completions":
                      self.send_json(404, {"error": {"message": "not found"}})
                      return
                  model = request.get("model") or "deepseek-v4-flash"
                  time.sleep(0.06)
                  self.send_json(200, {
                      "id": "chatcmpl-native-v9-live",
                      "object": "chat.completion",
                      "created": int(time.time()),
                      "model": model,
                      "choices": [{
                          "index": 0,
                          "message": {"role": "assistant", "content": "Native v9 live gateway probe passed."},
                          "finish_reason": "stop"
                      }],
                      "usage": {"prompt_tokens": 18, "completion_tokens": 9, "total_tokens": 27}
                  })

          ThreadingHTTPServer(("127.0.0.1", 45678), Handler).serve_forever()
          PY

          nohup python3 -u "$RUNNER_TEMP/live_upstream.py" > evidence/live-upstream.log 2>&1 &
          echo $! > evidence/live-upstream.pid
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail \
              http://127.0.0.1:45678/v1/models \
              > evidence/live-models.json; then
              exit 0
            fi
            sleep 1
          done
          cat evidence/live-upstream.log >&2 || true
          exit 1

      - name: Deploy the real Lite2API binary and verify routing
        shell: bash
        run: |
          set -euo pipefail
          cp config.example.json "$RUNNER_TEMP/lite2api-config.json"
          nohup env \
            LITE2API_API_KEYS="native-v9-live-client-key" \
            LITE2API_ADMIN_TOKEN="native-v9-live-admin-token" \
            LITE2API_ADMIN_AUTO_LOGIN="false" \
            LITE2API_ADMIN_ALLOWED_CIDRS="127.0.0.0/8,::1/128" \
            LITE2API_TRUSTED_PROXY_CIDRS="127.0.0.0/8,::1/128" \
            ATOMCODE2API_KEY="native-v9-live-upstream-key" \
            "$RUNNER_TEMP/lite2api" -config "$RUNNER_TEMP/lite2api-config.json" \
            > evidence/lite2api-server.log 2>&1 &
          echo $! > evidence/lite2api-server.pid

          ready=0
          for attempt in $(seq 1 60); do
            status="$(curl --silent --show-error \
              --output evidence/live-health.json \
              --write-out '%{http_code}' \
              http://127.0.0.1:45679/health || true)"
            if [ "$status" = "200" ] || [ "$status" = "503" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = "1"

          probe_status="$(curl --silent --show-error \
            --output evidence/live-gateway-probe.json \
            --write-out '%{http_code}' \
            http://127.0.0.1:45679/v1/chat/completions \
            -H 'Authorization: Bearer native-v9-live-client-key' \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-fast","messages":[{"role":"user","content":"Verify the live redesign deployment"}],"stream":false}')"
          printf '%s\n' "$probe_status" > evidence/live-gateway-probe-status.txt
          test "$probe_status" = "200"
          grep -q 'Native v9 live gateway probe passed' evidence/live-gateway-probe.json

      - name: Install Chromium dependencies and Chinese fonts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk > evidence/font-install.log
          fc-cache -f
          fc-match 'Noto Sans CJK SC' | tee evidence/font-match.txt
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          printf '%s\n' "$CHROME" > evidence/browser-executable.txt
          mkdir -p "$RUNNER_TEMP/browser"
          cd "$RUNNER_TEMP/browser"
          npm init -y > "$GITHUB_WORKSPACE/evidence/npm-init.log" 2>&1
          npm install --no-audit --no-fund playwright-core 2>&1 | tee "$GITHUB_WORKSPACE/evidence/playwright-install.log"

      - name: Capture the three redesigned pages with deterministic examples
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/browser/capture.js" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright-core');

          const output = process.env.OUTPUT_DIR;
          const diagnostics = [];
          const record = message => {
            const line = `${new Date().toISOString()} ${message}`;
            diagnostics.push(line);
            fs.writeFileSync(path.join(output, 'browser-diagnostics.txt'), diagnostics.join('\n') + '\n');
            console.log(line);
          };
          const ago = seconds => new Date(Date.now() - seconds * 1000).toISOString();
          const future = seconds => new Date(Date.now() + seconds * 1000).toISOString();

          const configuredAccounts = [
            {
              id:'codex-team',name:'Codex Team Pool',type:'openai',adapter_id:'cli-proxy-api',instance_id:'preview',base_url:'http://127.0.0.1:45678/v1',api_key_env:'PREVIEW_CODEX_KEY',operations:['openai.chat','openai.responses'],models:['gpt-5.6-codex','gpt-5.6-codex-fast'],capabilities:[
                {model:'sol',upstream_model:'gpt-5.6-codex',reasoning_efforts:['auto','low','medium','high','ultra']},
                {model:'sol@fast',upstream_model:'gpt-5.6-codex-fast',reasoning_efforts:['auto','low','medium','high']}
              ],priority:0,weight:3,concurrency:12,enabled:true
            },
            {
              id:'claude-team',name:'Claude Research',type:'openai',adapter_id:'generic-openai',instance_id:'preview',base_url:'http://127.0.0.1:45680/v1',api_key_env:'PREVIEW_CLAUDE_KEY',operations:['openai.chat'],models:['claude-sonnet-4-6'],capabilities:[
                {model:'claude',upstream_model:'claude-sonnet-4-6',reasoning_efforts:['auto','low','medium','high']}
              ],priority:0,weight:2,concurrency:8,enabled:true
            },
            {
              id:'gemini-team',name:'Gemini Workspace',type:'openai',adapter_id:'gemini-openai',instance_id:'preview',base_url:'http://127.0.0.1:45681/v1',api_key_env:'PREVIEW_GEMINI_KEY',operations:['openai.chat'],models:['gemini-3.6-flash','gemini-3.6-pro-vision'],capabilities:[
                {model:'gemini',upstream_model:'gemini-3.6-flash',reasoning_efforts:['auto','minimal','low','medium','high']},
                {model:'vision',upstream_model:'gemini-3.6-pro-vision',reasoning_efforts:['auto','medium','high']}
              ],priority:0,weight:2,concurrency:10,enabled:true
            },
            {
              id:'deepseek-primary',name:'DeepSeek Primary',type:'openai',adapter_id:'generic-openai',instance_id:'preview-primary',base_url:'http://127.0.0.1:45683/v1',api_key_env:'PREVIEW_DEEPSEEK_KEY',operations:['openai.chat'],models:['deepseek-reasoner'],capabilities:[
                {model:'deepseek',upstream_model:'deepseek-reasoner',reasoning_efforts:['auto','low','medium','high']}
              ],priority:0,weight:3,concurrency:6,enabled:true
            },
            {
              id:'deepseek-backup',name:'DeepSeek Backup',type:'openai',adapter_id:'generic-openai',instance_id:'preview-backup',base_url:'http://127.0.0.1:45684/v1',api_key_env:'PREVIEW_DEEPSEEK_BACKUP_KEY',operations:['openai.chat'],models:['deepseek-reasoner'],capabilities:[
                {model:'deepseek',upstream_model:'deepseek-reasoner',reasoning_efforts:['auto','low','medium','high']}
              ],priority:1,weight:1,concurrency:4,enabled:true
            },
            {
              id:'grok-canary',name:'Grok Canary',type:'openai',adapter_id:'generic-openai',instance_id:'preview-canary',base_url:'http://127.0.0.1:45685/v1',api_key_env:'PREVIEW_GROK_KEY',operations:['openai.chat'],models:['grok-4.5'],capabilities:[
                {model:'grok',upstream_model:'grok-4.5',reasoning_efforts:['auto','low','medium','high']}
              ],priority:0,weight:1,concurrency:2,enabled:true
            }
          ];

          const routes = {
            deepseek:{model:'deepseek',reasoning_effort:'high',targets:[{account:'deepseek-primary'},{account:'deepseek-backup'}]},
            sol:{model:'sol',reasoning_effort:'high',targets:[{account:'codex-team'}]},
            'sol-fast':{model:'sol@fast',reasoning_effort:'medium',targets:[{account:'codex-team'}]},
            claude:{model:'claude',reasoning_effort:'high',targets:[{account:'claude-team'}]},
            gemini:{model:'gemini',reasoning_effort:'medium',targets:[{account:'gemini-team'}]},
            vision:{model:'vision',reasoning_effort:'high',targets:[{account:'gemini-team'}]},
            grok:{model:'grok',reasoning_effort:'high',targets:[{account:'grok-canary'}]}
          };

          const runtimeAccounts = configuredAccounts.map(account => {
            const totals = {
              'codex-team':[1284,1278,84],
              'claude-team':[637,634,126],
              'gemini-team':[942,936,108],
              'deepseek-primary':[142,131,780],
              'deepseek-backup':[36,36,158],
              'grok-canary':[58,47,1120]
            }[account.id];
            return {
              id:account.id,name:account.name,type:account.type,adapter_id:account.adapter_id,instance_id:account.instance_id,
              base_url:account.base_url,models:account.models,operations:account.operations,priority:account.priority,weight:account.weight,
              concurrency:account.concurrency,active:0,enabled:true,total_requests:totals[0],successful_requests:totals[1],
              consecutive_failures:account.id==='grok-canary'?1:0,average_latency_ms:totals[2],
              ...(account.id==='grok-canary'?{last_error:'HTTP 503'}:{}),
              ...(account.id==='deepseek-primary'?{last_error:'HTTP 429'}:{})
            };
          });

          function requestRecord({seconds,model,upstream,account,status=200,latency=100,input=42,output=24,error=''}) {
            const success = status >= 200 && status < 400;
            return {
              time:ago(seconds),request_id:`fixture-${model}-${seconds}`,model,upstream_model:upstream,account_id:account,
              operation:'openai.chat',reasoning_effort:'high',client_key_id:'preview-client',client_key_name:'Visual QA key',
              path:'/v1/chat/completions',status,latency_ms:latency,input_type:'text',input_parts:1,text_parts:1,
              request_bytes:164,response_bytes:success?468:96,error,
              ...(success?{output_type:'text',usage_available:true,input_tokens:input,output_tokens:output,total_tokens:input+output,cached_tokens:Math.floor(input*.24),cache_rate:24,cache_rate_known:true}:{})
            };
          }

          function stateFixture() {
            const recent = [
              requestRecord({seconds:8,model:'sol',upstream:'gpt-5.6-codex',account:'codex-team',latency:88,input:76,output:31}),
              requestRecord({seconds:13,model:'grok',upstream:'grok-4.5',account:'grok-canary',status:503,latency:1130,error:'upstream returned 503'}),
              requestRecord({seconds:18,model:'vision',upstream:'gemini-3.6-pro-vision',account:'gemini-team',latency:176,input:94,output:38}),
              requestRecord({seconds:25,model:'deepseek',upstream:'deepseek-reasoner',account:'deepseek-backup',latency:164,input:68,output:29}),
              requestRecord({seconds:26,model:'deepseek',upstream:'deepseek-reasoner',account:'deepseek-primary',status:429,latency:41,error:'upstream returned 429'}),
              requestRecord({seconds:33,model:'gemini',upstream:'gemini-3.6-flash',account:'gemini-team',latency:102,input:51,output:26}),
              requestRecord({seconds:39,model:'claude',upstream:'claude-sonnet-4-6',account:'claude-team',latency:124,input:83,output:44}),
              requestRecord({seconds:46,model:'sol-fast',upstream:'gpt-5.6-codex-fast',account:'codex-team',latency:63,input:48,output:19}),
              requestRecord({seconds:58,model:'sol',upstream:'gpt-5.6-codex',account:'codex-team',latency:91,input:62,output:27}),
              requestRecord({seconds:74,model:'gemini',upstream:'gemini-3.6-flash',account:'gemini-team',latency:107,input:39,output:23}),
              requestRecord({seconds:91,model:'claude',upstream:'claude-sonnet-4-6',account:'claude-team',latency:132,input:72,output:41}),
              requestRecord({seconds:110,model:'sol-fast',upstream:'gpt-5.6-codex-fast',account:'codex-team',latency:66,input:45,output:18}),
              requestRecord({seconds:132,model:'deepseek',upstream:'deepseek-reasoner',account:'deepseek-backup',latency:169,input:57,output:25}),
              requestRecord({seconds:155,model:'vision',upstream:'gemini-3.6-pro-vision',account:'gemini-team',latency:188,input:105,output:43}),
              requestRecord({seconds:188,model:'sol',upstream:'gpt-5.6-codex',account:'codex-team',latency:86,input:59,output:22})
            ];
            const routeStates = [
              ['claude','ready','最近真实请求已验证',1,1,0,0,124,1],
              ['deepseek','ready','首选限流后已由备用连接接管',2,1,1,0,164,1],
              ['gemini','ready','最近真实请求已验证',1,1,0,0,107,1],
              ['grok','degraded','最近真实请求存在失败',1,0,1,0,1130,0],
              ['sol','ready','最近真实请求已验证',1,1,0,0,91,1],
              ['sol-fast','ready','最近真实请求已验证',1,1,0,0,66,1],
              ['vision','ready','最近真实请求已验证',1,1,0,0,188,1]
            ].map(([alias,state,reason,targets,ready,degraded,unknown,p95,successful]) => ({
              alias,state,reason,targets,ready_targets:ready,degraded_targets:degraded,unknown_targets:unknown,
              window:{duration_seconds:300,samples:alias==='deepseek'?2:1,successful,success_rate:successful?1:0,p95_latency_ms:p95,observed_at:ago(8)}
            }));
            return {
              accounts:runtimeAccounts,
              config:{server:{listen:'127.0.0.1:45679'},accounts:configuredAccounts,routes},
              models:['claude','claude-sonnet-4-6','deepseek','deepseek-reasoner','gemini','gemini-3.6-flash','gemini-3.6-pro-vision','grok','grok-4.5','sol','sol-fast','vision'],
              operations:{
                generated_at:ago(1),state:'degraded',reason:'Grok Canary 最近一次请求失败，其余六条路由正常',
                window:{duration_seconds:300,samples:47,successful:45,success_rate:45/47,p95_latency_ms:920,observed_at:ago(8)},
                capacity:{active:0,limit:42,utilization:0,unlimited:false},routes:routeStates
              },
              request_log:{enabled:true,current_bytes:164928,max_bytes:8388608,backups:1,retention_bytes:16777216,queued:0,dropped:0},
              stats:{started_at:ago(86400),requests:3041,successful:2998,failed:43,failovers:36,active:0,recent_limit:512,recent}
            };
          }

          function oauthFixture() {
            const quota = (kind,label,used,resetSeconds,extra={}) => ({kind,label,used_percentage:used,status:'available',reset_at:future(resetSeconds),observed_at:ago(20),source:'provider',...extra});
            return {data:[
              {
                id:'codex-a',provider:'codex',identity:'de***@studio.example',plan:'ChatGPT Team',status:'active',ready:true,success:1842,failed:9,updated_at:ago(300),last_refresh:ago(1800),
                quota_windows:[quota('five_hour','5 小时窗口',38,7200),quota('seven_day','7 天窗口',61,151200)],
                prompt_usage:{provider:'codex',model:'gpt-5.6-codex',input_tokens:1840,output_tokens:632,reasoning_tokens:420,cached_tokens:718,total_tokens:2892,observed_at:ago(20),source:'provider_usage',latency_ms:920}
              },
              {
                id:'codex-b',provider:'codex',identity:'in***@studio.example',plan:'ChatGPT Pro',status:'active',ready:true,success:963,failed:4,updated_at:ago(420),last_refresh:ago(2400),
                quota_windows:[quota('five_hour','5 小时窗口',72,3600),quota('seven_day','7 天窗口',44,129600)]
              },
              {
                id:'claude-a',provider:'anthropic',identity:'re***@lab.example',plan:'Claude Max',status:'active',ready:true,success:728,failed:3,updated_at:ago(360),last_refresh:ago(2700),
                quota_windows:[quota('five_hour','Session',27,10800),quota('seven_day_sonnet','Sonnet 周额度',84,208800)]
              },
              {
                id:'gemini-a',provider:'gemini',identity:'a***@workspace.example',plan:'Workspace',status:'active',ready:true,success:515,failed:8,updated_at:ago(500),last_refresh:ago(3200),
                quota_windows:[quota('daily','每日请求',46,32400),{kind:'model_quota',model:'Gemini Pro',remaining:42,unit:'requests',status:'available',reset_at:future(32400),observed_at:ago(20),source:'provider'}]
              },
              {
                id:'antigravity-a',provider:'antigravity',identity:'ca***@workspace.example',plan:'Preview',status:'unavailable',ready:false,success:121,failed:17,updated_at:ago(600),last_refresh:ago(4200),quota_exceeded:true,next_retry_after:future(3600),
                quota_windows:[{kind:'model_cooldown',model:'Gemini Preview',status:'cooldown',reset_at:future(3600),observed_at:ago(20),source:'provider'}]
              }
            ]};
          }

          function trendFixture() {
            const requests = [18,22,19,28,34,31,42,49,46,58,64,61,72,68,79,84,91,88,104,112,98,87,76,69];
            const failed =   [0, 1, 0, 1, 0, 2, 1, 0, 1, 2, 1, 0, 1, 1, 2, 1, 1, 0, 2, 1, 2, 1, 0, 1];
            const p95 =      [640,710,680,760,720,840,790,740,820,910,860,810,880,940,1020,970,890,850,930,1080,990,910,830,780];
            const now = Date.now();
            return {
              range_seconds:86400,bucket_seconds:3600,retention_seconds:604800,
              points:requests.map((value,index) => ({
                time:new Date(now-(requests.length-1-index)*3600000).toISOString(),requests:value,failed:failed[index],p95_latency_ms:p95[index]
              }))
            };
          }

          (async () => {
            const browser = await chromium.launch({
              headless:true,
              executablePath:process.env.CHROME,
              args:['--no-sandbox','--disable-dev-shm-usage','--font-render-hinting=none']
            });
            const context = await browser.newContext({
              viewport:{width:1440,height:1000},deviceScaleFactor:1,locale:'zh-CN',colorScheme:'light',reducedMotion:'reduce'
            });
            const page = await context.newPage();
            page.on('console',message=>record(`[console:${message.type()}] ${message.text()}`));
            page.on('pageerror',error=>record(`[pageerror] ${error.stack||error.message}`));
            page.on('requestfailed',request=>record(`[requestfailed] ${request.method()} ${request.url()} ${request.failure()?.errorText||''}`));

            await page.route('**/admin/api/state',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(stateFixture())}));
            await page.route('**/admin/api/trends?*',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(trendFixture())}));
            await page.route('**/admin/api/oauth/accounts',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify(oauthFixture())}));
            await page.route('**/admin/api/adapters',route=>route.fulfill({status:200,contentType:'application/json',body:JSON.stringify({data:[]})}));

            const login = await context.request.post('http://127.0.0.1:45679/admin/api/login',{data:{token:'native-v9-live-admin-token'}});
            const loginBody = await login.text();
            record(`[login] ${login.status()} ${loginBody}`);
            if(!login.ok())throw new Error(`admin login failed: ${login.status()} ${loginBody}`);

            await page.goto('http://127.0.0.1:45679/admin',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForSelector('#view-monitor.active .v9-command-center',{state:'visible',timeout:30000});
            await page.waitForFunction(()=>document.querySelectorAll('#routeHealthSummary .route-health-row').length===7,null,{timeout:30000});
            await page.waitForTimeout(1200);
            await page.screenshot({path:path.join(output,'lite2api-v9-final-overview-1440.png'),fullPage:false,animations:'disabled'});
            await page.screenshot({path:path.join(output,'lite2api-v9-final-overview-full.png'),fullPage:true,animations:'disabled'});
            record('[capture] overview');

            await page.locator('button[data-view="routes"]').click();
            await page.waitForSelector('#view-routes.active .v9-route-studio',{state:'visible',timeout:20000});
            await page.waitForSelector('#v5RouteList .route-master-item',{state:'visible',timeout:20000});
            const deepseek = page.locator('#v5RouteList .route-master-item').filter({hasText:'deepseek'}).first();
            if(await deepseek.count())await deepseek.click();
            await page.waitForTimeout(700);
            await page.evaluate(()=>document.activeElement?.blur());
            await page.screenshot({path:path.join(output,'lite2api-v9-final-routes-1440.png'),fullPage:false,animations:'disabled'});
            await page.screenshot({path:path.join(output,'lite2api-v9-final-routes-full.png'),fullPage:true,animations:'disabled'});
            record('[capture] routes');

            await page.locator('button[data-view="accounts"]').click();
            await page.waitForSelector('#view-accounts.active .v9-source-studio',{state:'visible',timeout:20000});
            await page.waitForFunction(()=>document.querySelectorAll('#oauthAccounts .channel-account').length===5,null,{timeout:20000});
            await page.waitForTimeout(800);
            await page.screenshot({path:path.join(output,'lite2api-v9-final-upstreams-1440.png'),fullPage:false,animations:'disabled'});
            await page.screenshot({path:path.join(output,'lite2api-v9-final-upstreams-full.png'),fullPage:true,animations:'disabled'});
            record('[capture] upstreams');

            fs.writeFileSync(path.join(output,'fixture-state.json'),JSON.stringify(stateFixture(),null,2));
            fs.writeFileSync(path.join(output,'fixture-oauth.json'),JSON.stringify(oauthFixture(),null,2));
            fs.writeFileSync(path.join(output,'fixture-trends.json'),JSON.stringify(trendFixture(),null,2));
            fs.writeFileSync(path.join(output,'rendered-admin.html'),await page.content());
            await browser.close();
          })().catch(error=>{
            record(`[fatal] ${error.stack||error.message||error}`);
            console.error(error.stack||error);
            process.exit(1);
          });
          NODE

          cd "$RUNNER_TEMP/browser"
          CHROME="$(cat "$GITHUB_WORKSPACE/evidence/browser-executable.txt")" \
            OUTPUT_DIR="$GITHUB_WORKSPACE/evidence" \
            node capture.js 2>&1 | tee "$GITHUB_WORKSPACE/evidence/playwright-run.log"
          file "$GITHUB_WORKSPACE/evidence"/*.png | tee "$GITHUB_WORKSPACE/evidence/screenshot-files.txt"
          sha256sum "$GITHUB_WORKSPACE/evidence"/*.png | tee "$GITHUB_WORKSPACE/evidence/screenshot-sha256.txt"

      - name: Write final visual acceptance report
        if: always()
        shell: bash
        run: |
          {
            echo "# Lite2API Native v9 final visual acceptance"
            echo
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Source validation: go test ./... and go build ./cmd/lite2api"
            echo "- Live validation: real Lite2API process plus a real routed Chat Completions probe"
            echo "- Visual data: deterministic Playwright fixtures for 6 upstream connections, 7 routes, 5 OAuth credentials, incidents, quota, and 24-hour trends"
            echo "- Captures: overview, routes, and upstreams in 1440 x 1000 plus full-page variants"
            echo
            echo "## Live gateway probe"
            echo '```json'
            cat evidence/live-gateway-probe.json 2>/dev/null || true
            echo
            echo '```'
            echo
            echo "## Browser diagnostics"
            echo '```text'
            cat evidence/browser-diagnostics.txt 2>/dev/null || true
            echo '```'
          } > evidence/final-visual-acceptance.md
          find evidence -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > evidence/file-list.txt

      - name: Upload final Native v9 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite2api-native-v9-final-visual-acceptance
          retention-days: 3
          if-no-files-found: error
          path: evidence/
