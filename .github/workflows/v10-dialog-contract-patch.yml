name: Temporary Native v10 dialog contract patch

on:
  push:
    branches:
      - "feat/admin-v9-core-redesign-20260819"

permissions:
  contents: write

jobs:
  patch-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/admin-v9-core-redesign-20260819
          fetch-depth: 1
      - name: Restore every import result contract
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('internal/web/native-v10-account-dialogs.html')
          text = path.read_text()
          old = '<div><span>账号失败</span><strong id="resultFailed">0</strong></div></div>'
          new = '''<div><span>账号失败</span><strong id="resultFailed">0</strong></div><div><span>OAuth 导入</span><strong id="resultOAuthImported">0</strong></div><div><span>OAuth 跳过</span><strong id="resultOAuthSkipped">0</strong></div><div><span>OAuth 失败</span><strong id="resultOAuthFailed">0</strong></div></div>'''
          if 'id="resultOAuthImported"' not in text:
              if old not in text:
                  raise SystemExit('import result insertion anchor not found')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY

          rm .github/workflows/v10-dialog-contract-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add internal/web/native-v10-account-dialogs.html .github/workflows/v10-dialog-contract-patch.yml
          git commit -m "fix: restore OAuth import result fields"
          git push origin HEAD:feat/admin-v9-core-redesign-20260819
