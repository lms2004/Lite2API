name: ChatGPT Lite2API deployment evidence publisher

on:
  push:
    branches:
      - "feat/chatgpt-deploy-preview-20260819"

permissions:
  contents: write

concurrency:
  group: chatgpt-lite2api-deploy-evidence
  cancel-in-progress: true

jobs:
  deploy-capture-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build Lite2API
        shell: bash
        run: |
          set -euo pipefail
          go test ./... | tee lite2api-go-test.log
          go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_SHA}" -o "$RUNNER_TEMP/lite2api" ./cmd/lite2api
          "$RUNNER_TEMP/lite2api" -version | tee lite2api-version.txt
          git rev-parse HEAD | tee lite2api-workflow-commit.txt
          printf '%s\n' '0fbc955393e079553bee84c4e37ddef257c8347c' > lite2api-code-baseline.txt

      - name: Start deterministic local upstream
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/mock_upstream.py" <<'PY'
          import json
          import time
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          class Handler(BaseHTTPRequestHandler):
              server_version = "Lite2APIPreviewUpstream/1.0"

              def log_message(self, fmt, *args):
                  print(fmt % args, flush=True)

              def send_json(self, status, payload):
                  body = json.dumps(payload, ensure_ascii=False).encode("utf-8")
                  self.send_response(status)
                  self.send_header("Content-Type", "application/json; charset=utf-8")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def do_GET(self):
                  if self.path.rstrip("/") == "/v1/models":
                      self.send_json(200, {
                          "object": "list",
                          "data": [
                              {"id": "deepseek-v4-flash", "object": "model", "owned_by": "preview-runner"},
                              {"id": "Qwen/Qwen3-VL-8B-Instruct", "object": "model", "owned_by": "preview-runner"},
                          ],
                      })
                      return
                  self.send_json(404, {"error": {"message": "not found"}})

              def do_POST(self):
                  length = int(self.headers.get("Content-Length", "0") or "0")
                  raw = self.rfile.read(length) if length else b"{}"
                  try:
                      request = json.loads(raw.decode("utf-8"))
                  except Exception:
                      request = {}
                  if self.path.rstrip("/") == "/v1/chat/completions":
                      model = request.get("model") or "deepseek-v4-flash"
                      self.send_json(200, {
                          "id": "chatcmpl-lite2api-preview",
                          "object": "chat.completion",
                          "created": int(time.time()),
                          "model": model,
                          "choices": [{
                              "index": 0,
                              "message": {"role": "assistant", "content": "Lite2API GitHub Runner deployment verified."},
                              "finish_reason": "stop",
                          }],
                          "usage": {"prompt_tokens": 12, "completion_tokens": 7, "total_tokens": 19},
                      })
                      return
                  if self.path.rstrip("/") == "/v1/responses":
                      model = request.get("model") or "deepseek-v4-flash"
                      self.send_json(200, {
                          "id": "resp-lite2api-preview",
                          "object": "response",
                          "created_at": int(time.time()),
                          "model": model,
                          "status": "completed",
                          "output": [{
                              "type": "message",
                              "role": "assistant",
                              "content": [{"type": "output_text", "text": "Lite2API GitHub Runner deployment verified."}],
                          }],
                          "usage": {"input_tokens": 12, "output_tokens": 7, "total_tokens": 19},
                      })
                      return
                  self.send_json(404, {"error": {"message": "not found"}})

          ThreadingHTTPServer(("127.0.0.1", 45678), Handler).serve_forever()
          PY

          nohup python3 -u "$RUNNER_TEMP/mock_upstream.py" > mock-upstream.log 2>&1 &
          echo $! > mock-upstream.pid
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail http://127.0.0.1:45678/v1/models > mock-models.json; then
              exit 0
            fi
            sleep 1
          done
          cat mock-upstream.log >&2 || true
          exit 1

      - name: Start and verify Lite2API service
        shell: bash
        run: |
          set -euo pipefail
          cp config.example.json "$RUNNER_TEMP/lite2api-config.json"
          nohup env \
            LITE2API_API_KEYS="ci-preview-gateway-key-20260819" \
            LITE2API_ADMIN_TOKEN="ci-preview-admin-token-20260819" \
            LITE2API_ADMIN_AUTO_LOGIN="false" \
            LITE2API_ADMIN_ALLOWED_CIDRS="127.0.0.0/8,::1/128" \
            LITE2API_TRUSTED_PROXY_CIDRS="127.0.0.0/8,::1/128" \
            ATOMCODE2API_KEY="ci-preview-upstream-key" \
            "$RUNNER_TEMP/lite2api" -config "$RUNNER_TEMP/lite2api-config.json" \
            > lite2api-server.log 2>&1 &
          echo $! > lite2api-server.pid

          ready=0
          for attempt in $(seq 1 60); do
            code="$(curl --silent --show-error --output lite2api-health.json --write-out '%{http_code}' http://127.0.0.1:45679/health || true)"
            printf '%s\n' "$code" > lite2api-health-status.txt
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Lite2API did not expose its health endpoint" >&2
            cat lite2api-server.log >&2 || true
            exit 1
          fi

          admin_code="$(curl --silent --show-error --output lite2api-admin-response.html --write-out '%{http_code}' http://127.0.0.1:45679/admin)"
          printf '%s\n' "$admin_code" > lite2api-admin-status.txt
          test "$admin_code" = "200"

          request_code="$(curl --silent --show-error --output lite2api-sample-response.json --write-out '%{http_code}' \
            http://127.0.0.1:45679/v1/chat/completions \
            -H 'Authorization: Bearer ci-preview-gateway-key-20260819' \
            -H 'Content-Type: application/json' \
            --data '{"model":"deepseek-fast","messages":[{"role":"user","content":"Runner deployment check"}],"stream":false}')"
          printf '%s\n' "$request_code" > lite2api-sample-status.txt
          test "$request_code" = "200"
          sleep 2

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lite2api-browser"
          cd "$RUNNER_TEMP/lite2api-browser"
          npm init -y > "$GITHUB_WORKSPACE/playwright-npm-init.log" 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 2>&1 | tee "$GITHUB_WORKSPACE/playwright-install.log"
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" npx playwright install --with-deps chromium 2>&1 | tee "$GITHUB_WORKSPACE/playwright-browser-install.log"

      - name: Capture authenticated admin page with Playwright
        shell: bash
        run: |
          set -uo pipefail
          cat > "$RUNNER_TEMP/lite2api-browser/capture.js" <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { chromium } = require('playwright');

          const outputDir = process.env.OUTPUT_DIR;
          const diagnosticsPath = path.join(outputDir, 'lite2api-browser-diagnostics.txt');
          const lines = [];
          const record = (line) => {
            const value = `${new Date().toISOString()} ${line}`;
            lines.push(value);
            fs.writeFileSync(diagnosticsPath, lines.join('\n') + '\n');
            console.log(value);
          };

          (async () => {
            const browser = await chromium.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-dev-shm-usage', '--font-render-hinting=none'],
            });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1000 },
              deviceScaleFactor: 1,
              locale: 'zh-CN',
              colorScheme: 'light',
              reducedMotion: 'reduce',
            });
            const page = await context.newPage();
            page.on('console', (msg) => record(`[console:${msg.type()}] ${msg.text()}`));
            page.on('pageerror', (err) => record(`[pageerror] ${err.stack || err.message}`));
            page.on('requestfailed', (req) => record(`[requestfailed] ${req.method()} ${req.url()} ${req.failure()?.errorText || ''}`));
            page.on('response', (response) => {
              if (response.url().includes('/admin/api/')) record(`[response] ${response.status()} ${response.url()}`);
            });

            try {
              record('[phase] login through BrowserContext request API');
              const login = await context.request.post('http://127.0.0.1:45679/admin/api/login', {
                data: { token: 'ci-preview-admin-token-20260819' },
              });
              const loginBody = await login.text();
              record(`[login] ${login.status()} ${loginBody}`);
              if (!login.ok()) throw new Error(`admin login failed: ${login.status()} ${loginBody}`);

              record('[phase] open live admin page');
              await page.goto('http://127.0.0.1:45679/admin', {
                waitUntil: 'load',
                timeout: 45000,
              });
              await page.waitForSelector('.native-shell', { state: 'visible', timeout: 30000 });
              await page.waitForSelector('#view-monitor.active', { state: 'visible', timeout: 30000 });
              await page.waitForFunction(() => {
                const value = document.querySelector('#lastUpdated')?.textContent || '';
                return value.includes('最近更新');
              }, null, { timeout: 30000 });
              await page.waitForTimeout(1800);

              const session = await context.request.get('http://127.0.0.1:45679/admin/api/session');
              const state = await context.request.get('http://127.0.0.1:45679/admin/api/state');
              const sessionBody = await session.text();
              const stateBody = await state.text();
              record(`[session] ${session.status()} ${sessionBody}`);
              record(`[state] ${state.status()} ${stateBody.slice(0, 4000)}`);
              if (!session.ok() || !state.ok()) throw new Error('authenticated admin API verification failed');

              const pageState = await page.evaluate(() => ({
                title: document.title,
                build: document.querySelector('#uiBuild')?.textContent || '',
                updated: document.querySelector('#lastUpdated')?.textContent || '',
                health: document.querySelector('#healthVerdict')?.innerText || '',
                routes: document.querySelector('#routeHealthSummary')?.innerText || '',
                bodySize: document.body.innerText.length,
              }));
              fs.writeFileSync(path.join(outputDir, 'lite2api-page-state.json'), JSON.stringify(pageState, null, 2));
              record(`[page-state] ${JSON.stringify(pageState)}`);

              await page.screenshot({
                path: path.join(outputDir, 'lite2api-admin-1440.png'),
                fullPage: false,
                animations: 'disabled',
              });
              await page.screenshot({
                path: path.join(outputDir, 'lite2api-admin-full.png'),
                fullPage: true,
                animations: 'disabled',
              });
              fs.writeFileSync(path.join(outputDir, 'lite2api-admin-page.html'), await page.content());
              record('[result] screenshots captured');
            } catch (error) {
              record(`[fatal] ${error.stack || error.message || error}`);
              try {
                fs.writeFileSync(path.join(outputDir, 'lite2api-admin-page-failure.html'), await page.content());
                await page.screenshot({
                  path: path.join(outputDir, 'lite2api-admin-failure.png'),
                  fullPage: true,
                  animations: 'disabled',
                });
                record('[result] failure screenshot captured');
              } catch (captureError) {
                record(`[failure-capture-error] ${captureError.stack || captureError.message || captureError}`);
              }
              throw error;
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error.stack || error);
            process.exit(1);
          });
          NODE

          cd "$RUNNER_TEMP/lite2api-browser"
          set +e
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright" OUTPUT_DIR="$GITHUB_WORKSPACE" node capture.js 2>&1 | tee "$GITHUB_WORKSPACE/playwright-run.log"
          capture_status="${PIPESTATUS[0]}"
          set -e
          printf '%s\n' "$capture_status" > "$GITHUB_WORKSPACE/playwright-exit-status.txt"
          exit "$capture_status"

      - name: Prepare deployment evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf preview-output
          mkdir -p preview-output

          for file in \
            lite2api-go-test.log \
            lite2api-version.txt \
            lite2api-workflow-commit.txt \
            lite2api-code-baseline.txt \
            mock-upstream.log \
            mock-models.json \
            lite2api-health.json \
            lite2api-health-status.txt \
            lite2api-admin-status.txt \
            lite2api-sample-response.json \
            lite2api-sample-status.txt \
            lite2api-server.log \
            playwright-install.log \
            playwright-browser-install.log \
            playwright-run.log \
            playwright-exit-status.txt \
            lite2api-browser-diagnostics.txt \
            lite2api-page-state.json \
            lite2api-admin-page.html \
            lite2api-admin-page-failure.html; do
            [ ! -f "$file" ] || cp "$file" preview-output/
          done

          for image in lite2api-admin-1440.png lite2api-admin-full.png lite2api-admin-failure.png; do
            if [ -f "$image" ]; then
              base64 -w 76 "$image" > "preview-output/${image}.b64"
              file "$image" > "preview-output/${image}.file.txt"
              sha256sum "$image" > "preview-output/${image}.sha256.txt"
            fi
          done

          {
            echo "# Lite2API GitHub Actions deployment report"
            echo
            echo "- Repository: lms2004/Lite2API"
            echo "- Code baseline: 0fbc955393e079553bee84c4e37ddef257c8347c"
            echo "- Workflow commit: ${GITHUB_SHA}"
            echo "- Runner: ${RUNNER_OS}/${RUNNER_ARCH}"
            echo "- Validation: go test ./... + go build ./cmd/lite2api"
            echo "- Service: http://127.0.0.1:45679"
            echo "- Browser: Playwright Chromium"
            echo "- Viewport: 1440 x 1000"
            echo
            echo "## Endpoint status"
            echo
            echo "- /health: $(cat lite2api-health-status.txt 2>/dev/null || echo missing)"
            echo "- /admin: $(cat lite2api-admin-status.txt 2>/dev/null || echo missing)"
            echo "- sample /v1/chat/completions: $(cat lite2api-sample-status.txt 2>/dev/null || echo missing)"
            echo "- Playwright exit: $(cat playwright-exit-status.txt 2>/dev/null || echo missing)"
            echo
            echo "## Server log tail"
            echo '```text'
            tail -n 120 lite2api-server.log 2>/dev/null || true
            echo '```'
          } > preview-output/deployment-report.md

          sha256sum preview-output/* > preview-output/SHA256SUMS.txt
          find preview-output -maxdepth 1 -type f -printf '%f %s bytes\n' | sort > preview-output/FILE-LIST.txt

      - name: Upload deployment evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lite2api-deploy-preview
          if-no-files-found: error
          retention-days: 1
          path: preview-output/

      - name: Commit evidence to temporary preview branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f preview-output
          if git diff --cached --quiet; then
            echo "No evidence files to publish"
            exit 0
          fi
          git commit -m "ci: publish Playwright deployment evidence [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
