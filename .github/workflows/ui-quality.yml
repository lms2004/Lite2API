name: UI quality

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "internal/web/**"
      - "internal/gateway/server.go"
      - "go.mod"
      - ".github/workflows/ui-quality.yml"
  pull_request:
    paths:
      - "internal/web/**"
      - "internal/gateway/server.go"
      - "go.mod"
      - ".github/workflows/ui-quality.yml"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests and native UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l internal/web internal/gateway)
          if [ -n "$files" ]; then
            echo "The following Go files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Verify native v5 source assets
        shell: bash
        run: |
          set -euo pipefail
          test -s internal/web/native-v5.css
          test -s internal/web/native-v5.js
          test -s internal/web/native-v5-shell.html
          test -s internal/web/native-v5-monitor.html
          test -s internal/web/native-v5-routes.html
          test -s internal/web/native-v5-accounts.html
          test -s internal/web/native-v5-keys.html
          grep -Fq -- '--canvas:#f5f5f7' internal/web/native-v5.css
          grep -Fq -- '.route-workspace{min-height:610px;display:grid;grid-template-columns:230px minmax(0,1fr)' internal/web/native-v5.css
          grep -Fq -- '.nav{grid-template-columns:repeat(4,1fr)}' internal/web/native-v5.css
          grep -Fq -- 'window.Lite2APINativeV5' internal/web/native-v5.js
          grep -Fq -- 'id="v5RouteList"' internal/web/native-v5-routes.html
          grep -Fq -- 'id="v5KeyDialog"' internal/web/native-v5-keys.html

      - name: Check JavaScript syntax
        run: node --check internal/web/native-v5.js
