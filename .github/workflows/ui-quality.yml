name: UI quality

on:
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "internal/web/**"
      - "internal/config/**"
      - "internal/gateway/**"
      - "go.mod"
      - ".github/workflows/ui-quality.yml"
  pull_request:
    paths:
      - "internal/web/**"
      - "internal/config/**"
      - "internal/gateway/**"
      - "go.mod"
      - ".github/workflows/ui-quality.yml"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go tests, discovery, and native UI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          files=$(gofmt -l internal/web internal/config internal/gateway)
          if [ -n "$files" ]; then
            echo "The following Go files require gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run tests
        run: go test ./...

      - name: Verify capability and native source assets
        shell: bash
        run: |
          set -euo pipefail
          test -s internal/config/capability_discovery.go
          test -s internal/gateway/capabilitysync.go
          test -s internal/gateway/accounttest.go
          grep -Fq -- 'capabilityDiscoveryInterval' internal/gateway/capabilitysync.go
          grep -Fq -- 'InferDiscoveredCapabilities' internal/config/capability_discovery.go
          grep -Fq -- 'serveAccountTest' internal/gateway/admin.go
          grep -Fq -- 'probeAccountModels' internal/gateway/accounttest.go

          for file in \
            internal/web/native-v5.css \
            internal/web/native-v5.js \
            internal/web/native-v6.css \
            internal/web/native-v6.js \
            internal/web/native-v7.css \
            internal/web/native-v7.js \
            internal/web/native-v8.css \
            internal/web/native-v9.css \
            internal/web/native-v9-refine.css \
            internal/web/native-v9.js \
            internal/web/native-v10.css \
            internal/web/native-v10.js \
            internal/web/native-v10-account-dialogs.html \
            internal/web/native-v5-shell.html \
            internal/web/native-v5-monitor.html \
            internal/web/native-v5-routes.html \
            internal/web/native-v5-accounts.html \
            internal/web/native-v5-keys.html; do
            test -s "$file"
          done

          grep -Fq -- '--canvas:#f5f5f7' internal/web/native-v5.css
          grep -Fq -- '.grouped-surface,.grouped-section' internal/web/native-v6.css
          grep -Fq -- '.v7-model-dialog' internal/web/native-v7.css
          grep -Fq -- 'Native v8' internal/web/native-v8.css
          grep -Fq -- 'Native v9' internal/web/native-v9.css
          grep -Fq -- 'Native v10' internal/web/native-v10.css
          grep -Fq -- '.v10-kpi-strip' internal/web/native-v10.css
          grep -Fq -- '.v10-onboarding-body' internal/web/native-v10.css
          grep -Fq -- 'window.Lite2APINativeV10' internal/web/native-v10.js
          grep -Fq -- 'id="v10ProviderGrid"' internal/web/native-v10-account-dialogs.html
          grep -Fq -- 'id="v10TestAccountBtn"' internal/web/native-v10-account-dialogs.html
          grep -Fq -- 'id="resultOAuthImported"' internal/web/native-v10-account-dialogs.html
          grep -Fq -- 'class="v9-route-studio"' internal/web/native-v5-routes.html
          grep -Fq -- 'class="v10-account-workspace"' internal/web/native-v5-accounts.html
          grep -Fq -- 'id="v10QuotaBoard"' internal/web/native-v5-monitor.html
          grep -Fq -- 'id="v10QualityRows"' internal/web/native-v5-monitor.html
          grep -Fq -- 'id="v6KeyList"' internal/web/native-v5-keys.html
          grep -Fq -- 'id="v6ClientBaseURL"' internal/web/native-v5-keys.html

      - name: Check JavaScript syntax
        run: |
          node --check internal/web/native-v5.js
          node --check internal/web/native-v6.js
          node --check internal/web/native-v7.js
          node --check internal/web/native-v9.js
          node --check internal/web/native-v10.js
