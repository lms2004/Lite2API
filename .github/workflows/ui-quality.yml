name: UI quality

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "internal/web/**"
      - "internal/config/**"
      - "internal/gateway/**"
      - "go.mod"
      - ".github/workflows/ui-quality.yml"
  pull_request:
    paths:
      - "internal/web/**"
      - "internal/config/**"
      - "internal/gateway/**"
      - "go.mod"
      - ".github/workflows/ui-quality.yml"

permissions:
  contents: read

concurrency:
  group: ui-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Canonical UI contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: 1.26.5
          cache: false

      - name: Verify formatting and Go contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t unformatted < <(gofmt -l internal/web internal/config internal/gateway)
          if ((${#unformatted[@]})); then
            printf 'gofmt required: %s\n' "${unformatted[@]}" >&2
            exit 1
          fi
          go test ./internal/web ./internal/config ./internal/gateway

      - name: Verify the single canonical source tree
        shell: bash
        run: |
          set -euo pipefail
          for file in app.html app.css app-core.js app-core.test.js app.js embed.go embed_test.go; do
            test -s "internal/web/$file"
          done
          test ! -e internal/web/index.html
          test -z "$(find internal/web -maxdepth 1 -name 'native-*' -print -quit)"
          grep -Fq 'data-ui="canonical-usage-console"' internal/web/app.html
          grep -Fq 'function testManualAccount(' internal/web/app.js
          grep -Fq 'function validateAndRenderRoutes(' internal/web/app.js
          grep -Fq 'function discardRouteChanges(' internal/web/app.js
          grep -Fq 'function showOnboardingResult(' internal/web/app.js
          if grep -Eq 'onclick[[:space:]]*=' internal/web/app.html; then
            echo 'Inline click handlers are forbidden' >&2
            exit 1
          fi
          if grep -Rq 'MutationObserver\|window\.render\|window\.save' internal/web; then
            echo 'Runtime patch layers or global overrides are forbidden' >&2
            exit 1
          fi

      - name: Check JavaScript domain contracts
        run: |
          node --check internal/web/app-core.js
          node --check internal/web/app.js
          node --test internal/web/app-core.test.js
