services:
  grok2api:
    profiles: ["grok"]
    image: "${GROK2API_IMAGE:-ghcr.io/chenyme/grok2api:latest}"
    container_name: lite2api-grok2api
    restart: unless-stopped
    network_mode: host
    init: true
    stop_grace_period: 30s
    command: ["/app/grok2api", "--config", "/app/config.yaml", "--listen", "127.0.0.1:45680"]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./channels/runtime/grok2api/config.yaml:/run/grok2api/config.yaml:ro
      - lite2api-grok-data:/app/data
      - lite2api-grok-quality:/var/lib/grok2api-quality-guard
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:45680/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  gemini-web2api:
    profiles: ["gemini"]
    build:
      context: .
      dockerfile: channels/gemini-web2api/Dockerfile
    image: lite2api/gemini-web2api:local
    container_name: lite2api-gemini-web2api
    restart: unless-stopped
    network_mode: host
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    volumes:
      - ./channels/runtime/gemini-web2api/config.json:/app/config.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:45681/', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lite2api-grok-data:
  lite2api-grok-quality:
