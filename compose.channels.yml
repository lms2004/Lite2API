services:
  cliproxyapi:
    profiles: ["oauth"]
    build:
      context: .
      dockerfile: channels/cliproxyapi/Dockerfile
      args:
        VERSION: v6.10.9-lite2api.6
        COMMIT: 785b00c3127eea6aa207f1207ead8a2aa93690a3
        # Quote ISO dates: YAML otherwise coerces this into a timestamp and
        # Compose rejects the build-arg schema before any container starts.
        BUILD_DATE: "2026-08-24"
    image: lite2api/cliproxyapi:v6.10.9-lite2api.6
    container_name: lite2api-cliproxyapi
    restart: unless-stopped
    networks: [channel-oauth]
    ports:
      - "127.0.0.1:45682:45682"
    user: "${CHANNEL_RUNTIME_UID:-10001}:${CHANNEL_RUNTIME_GID:-10001}"
    environment:
      MANAGEMENT_PASSWORD: ${CLIPROXYAPI_MANAGEMENT_KEY:?CLIPROXYAPI_MANAGEMENT_KEY is required for OAuth account setup}
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    cpus: 0.75
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      # The loopback-only management API persists the selected routing strategy.
      - type: bind
        source: ./channels/runtime/cliproxyapi/config.yaml
        target: /CLIProxyAPI/config.yaml
        bind:
          create_host_path: false
      - type: bind
        source: ./channels/runtime/cliproxyapi/auths
        target: /run/cliproxyapi/auths
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/usr/local/bin/cliproxy-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  grok2api:
    profiles: ["grok"]
    image: "${GROK2API_IMAGE:-ghcr.io/chenyme/grok2api@sha256:afd5218d68e72e221fb54aba0b6fc78214d008d7ffeb85e865430777114481c0}"
    container_name: lite2api-grok2api
    restart: unless-stopped
    depends_on:
      grok2api-init:
        condition: service_completed_successfully
    networks: [channel-grok]
    ports:
      - "127.0.0.1:45680:45680"
    user: "${CHANNEL_RUNTIME_UID:-10001}:${CHANNEL_RUNTIME_GID:-10001}"
    init: true
    stop_grace_period: 30s
    # Bypass the vendor entrypoint: it requires root to mkdir/chown, copies to
    # the read-only /app tree, and depends on GROK2API_CONFIG_SOURCE. The init
    # service below owns the only writable volumes before this non-root start.
    entrypoint: ["/app/grok2api"]
    command: ["--config", "/run/grok2api/config.yaml", "--listen", "0.0.0.0:45680"]
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 256
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - type: bind
        source: ./channels/runtime/grok2api/config.yaml
        target: /run/grok2api/config.yaml
        read_only: true
        bind:
          create_host_path: false
      - lite2api-grok-data:/app/data
      - lite2api-grok-quality:/var/lib/grok2api-quality-guard
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:45680/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  grok2api-init:
    profiles: ["grok"]
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["CHOWN", "DAC_OVERRIDE", "FOWNER"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    environment:
      CHANNEL_RUNTIME_UID: "${CHANNEL_RUNTIME_UID:-10001}"
      CHANNEL_RUNTIME_GID: "${CHANNEL_RUNTIME_GID:-10001}"
    command:
      - /bin/sh
      - -ec
      - |
        case "$$CHANNEL_RUNTIME_UID" in ''|*[!0-9]*) exit 64;; esac
        case "$$CHANNEL_RUNTIME_GID" in ''|*[!0-9]*) exit 64;; esac
        [ "$$CHANNEL_RUNTIME_UID" -gt 0 ] && [ "$$CHANNEL_RUNTIME_GID" -gt 0 ]
        install -d -o "$$CHANNEL_RUNTIME_UID" -g "$$CHANNEL_RUNTIME_GID" -m 0700 /app/data /var/lib/grok2api-quality-guard
    volumes:
      - lite2api-grok-data:/app/data
      - lite2api-grok-quality:/var/lib/grok2api-quality-guard

  gemini-web2api:
    profiles: ["gemini"]
    build:
      context: .
      dockerfile: channels/gemini-web2api/Dockerfile
    image: lite2api/gemini-web2api:local
    container_name: lite2api-gemini-web2api
    restart: unless-stopped
    networks: [channel-gemini]
    ports:
      - "127.0.0.1:45681:45681"
    user: "${CHANNEL_RUNTIME_UID:-10001}:${CHANNEL_RUNTIME_GID:-10001}"
    init: true
    stop_grace_period: 15s
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    cpus: 0.75
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    volumes:
      - type: bind
        source: ./channels/runtime/gemini-web2api/config.json
        target: /app/config.json
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:45681/', timeout=5).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  lite2api-grok-data:
  lite2api-grok-quality:

networks:
  channel-oauth:
    driver: bridge
  channel-grok:
    driver: bridge
  channel-gemini:
    driver: bridge
