services:
  lite2api:
    build: .
    image: lite2api:local
    container_name: lite2api
    restart: unless-stopped
    network_mode: host
    cpus: 1.5
    mem_limit: 256m
    pids_limit: 128
    user: "10001:10001"
    read_only: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    volumes:
      - lite2api-data:/app/data
    environment:
      GOMAXPROCS: "2"
      GOMEMLIMIT: "192MiB"
      LITE2API_API_KEYS: ${LITE2API_API_KEYS:?LITE2API_API_KEYS is required}
      LITE2API_ADMIN_TOKEN: ${LITE2API_ADMIN_TOKEN:?LITE2API_ADMIN_TOKEN is required}
      LITE2API_ADMIN_ALLOWED_CIDRS: ${LITE2API_ADMIN_ALLOWED_CIDRS:-127.0.0.0/8,::1/128}
      LITE2API_TRUSTED_PROXY_CIDRS: ${LITE2API_TRUSTED_PROXY_CIDRS:-127.0.0.0/8,::1/128}
      LITE2API_MAX_BODY_BYTES: ${LITE2API_MAX_BODY_BYTES:-8388608}
      LITE2API_MAX_INFLIGHT_REQUESTS: ${LITE2API_MAX_INFLIGHT_REQUESTS:-32}
      LITE2API_MAX_IDLE_CONNS: ${LITE2API_MAX_IDLE_CONNS:-128}
      LITE2API_MAX_IDLE_CONNS_PER_HOST: ${LITE2API_MAX_IDLE_CONNS_PER_HOST:-64}
      LITE2API_MAX_CONNS_PER_HOST: ${LITE2API_MAX_CONNS_PER_HOST:-64}
      ATOMCODE2API_KEY: ${ATOMCODE2API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GROK2API_KEY: ${GROK2API_KEY:-}
      GEMINI_WEB2API_KEY: ${GEMINI_WEB2API_KEY:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "5", "-O", "/dev/null", "http://127.0.0.1:45679/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  lite2api-data:
